<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="掃到南天門">
<meta name="theme-color" content="#12131f">
<link rel="apple-touch-icon" href="ink/icon-180.png">
</head>
<body>
<title>一路掃到南天門</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* 版面：直立一欄，整頁剛好一個螢幕高、不會捲動。上：境界與資源；中：戰鬥畫面（4:3，永遠看得到）；
   下：系統面板（固定高度，只有面板裡面會捲）；最底：分頁按鈕（大拇指按得到）。橫放時這一欄置中，兩邊是墨色。
   配色：墨石深色底、宣紙色字、金色與朱紅點綴。 */
:root {
  --ink: #15120f; --panel: #221e19; --panel2: #2d2822; --line: #4d4337;
  --text: #f1ebdd; --muted: #b5aa95; --gold: #e6bd5c; --jade: #5fc79a; --cinnabar: #c3412f; --sky: #79c6ff;
  --tabh: 60px;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--ink); color: var(--text); height: 100%; overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; margin: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: manipulation;
  background: radial-gradient(ellipse at 50% 0%, #2a241d 0%, transparent 60%), radial-gradient(ellipse at 0% 100%, #231d17 0%, transparent 55%), radial-gradient(ellipse at 100% 80%, #1e1a15 0%, transparent 50%), var(--ink); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { cursor: default; opacity: 0.45; }
#app { position: fixed; top: 0; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 760px; height: 100dvh; box-sizing: border-box; overflow: hidden;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "head" "stage" "panel" "tabs"; grid-template-columns: minmax(0, 1fr); gap: 8px;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
@supports not (height: 100dvh) { #app { height: 100vh; } }
#rotate { display: none; }
/* 手機橫放太矮，請小朋友轉回直的 */
@media (orientation: landscape) and (max-height: 500px) {
  #rotate { display: grid; position: fixed; inset: 0; z-index: 50; place-content: center; gap: 12px; text-align: center; background: var(--ink); font-family: var(--display); font-size: 22px; color: var(--gold); }
  #rotate span { font-size: 54px; display: block; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(90deg); } 60%, 100% { transform: rotate(0deg); } }
}
#app > .top { grid-area: head; } #app > .stage { grid-area: stage; } #app > #panel { grid-area: panel; } #app > .tabs { grid-area: tabs; }

.top { display: grid; gap: 6px; }
.titlebar { display: none; }
.title { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: 0.06em; color: var(--gold); text-shadow: 0 2px 0 #5a3d0a; }
.stagechip { font-size: 13px; color: var(--muted); }
.realmrow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.realm { font-family: var(--display); font-weight: 900; font-size: 17px; white-space: nowrap; }
.bar { position: relative; height: 18px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; min-width: 0; }
.bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #3f9f7c, var(--jade)); width: 0; transition: width .2s; }
.bar span { position: relative; display: block; text-align: center; font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 #000; }
#breakBtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; font-weight: 900; }
#breakBtn.ready { background: var(--gold); color: #2a1d02; border-color: #ffe9a6; animation: glow 1s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 0 rgba(242,198,90,0); } to { box-shadow: 0 0 14px rgba(242,198,90,0.9); } }
.res { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 14px; font-variant-numeric: tabular-nums; }
.res b { font-weight: 900; }
.ic { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; }
.ic.stone { background: var(--jade); transform: rotate(45deg) scale(.8); box-shadow: inset -3px -3px 0 #2f8c68; }
.ic.egg { background: #f5efe2; border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%; box-shadow: inset -3px -2px 0 #cbbfa8; width: 11px; height: 13px; }
.ic.herb { background: #6fd06a; border-radius: 0 70% 0 70%; box-shadow: inset -2px -2px 0 #3f8f52; }
.el { display: inline-block; min-width: 18px; padding: 0 4px; border-radius: 5px; font-size: 12px; font-weight: 900; color: #1a1420; text-align: center; margin-left: 4px; vertical-align: 1px; }
.aff { font-size: 12px; color: #cfe9ff; }
.combo { color: var(--gold); font-size: 12px; }
.xin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.xin .path { background: var(--panel2); border-radius: 10px; padding: 6px; display: grid; gap: 6px; align-content: start; }
.xin .path h4 { margin: 0; text-align: center; font-family: var(--display); color: var(--gold); }
.xin .node { display: grid; gap: 2px; font-size: 12px; text-align: center; border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
.xin .node b { font-size: 14px; }
.xin .node button { background: var(--jade); color: #082018; border-radius: 6px; font-weight: 900; padding: 2px 0; }
.xin .node button:disabled { background: #3a3f58; color: var(--muted); }
.pills { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.pill { background: var(--panel2); border-radius: 10px; padding: 6px 8px; display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.pill b { color: var(--text); font-size: 14px; }
.pill .on { color: var(--jade); font-weight: 900; }
.combos { display: grid; gap: 6px; }
.combos div { background: var(--panel2); border-radius: 8px; padding: 6px 8px; font-size: 12px; color: var(--muted); border-left: 4px solid var(--line); }
.combos div.on { border-left-color: var(--gold); color: var(--text); }
.combos b { color: var(--gold); }
.ten { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; cursor: pointer; }
.ten .tc { background: var(--panel2); border: 2px solid var(--line); border-radius: 8px; padding: 4px 2px; display: grid; justify-items: center; gap: 1px; font-size: 11px; transition: opacity .2s; }
.ten .tc canvas { image-rendering: pixelated; }
.ten .tc b { font-size: 12px; }
.ten .tc span { color: var(--muted); }
.ten .tc span.new { color: var(--gold); font-weight: 900; }
.wash label { display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 14px; }
.ic.iron { background: #9aa4b5; box-shadow: inset -3px -3px 0 #626c7e; border-radius: 2px; }

.stage { position: relative; border-radius: 6px; overflow: hidden; border: 2px solid #5a4b38; box-shadow: 0 0 0 1px #000, 0 6px 18px rgba(0,0,0,.5); background: #000;
  /* 畫面太矮的時候（橫放），戰鬥畫面縮小一點，留至少 260px 給系統面板 */
  width: min(100%, calc((100dvh - 330px - var(--tabh)) * 4 / 3)); justify-self: center; }
#cv { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; }
.ver { position: absolute; right: 6px; bottom: 4px; font-size: 10px; color: rgba(255,255,255,.55); text-shadow: 0 1px 2px #000; pointer-events: none; }
.hud-l .area { font-size: 12px; color: #f6efe0; opacity: .9; }
.hud-l { position: absolute; left: 8px; top: 6px; font-size: 13px; text-shadow: 0 1px 2px #000, 0 0 3px #000; pointer-events: none; }
.hud-l b { font-family: var(--display); font-size: 15px; }
.hud-r { position: absolute; right: 6px; top: 6px; display: flex; gap: 6px; align-items: center; }
#bossBtn { background: var(--cinnabar); color: #fff; font-weight: 900; border-radius: 8px; padding: 3px 10px; font-size: 13px; box-shadow: 0 2px 0 #7a2416; }
#autoBtn { background: rgba(10,10,20,.6); border-radius: 8px; padding: 3px 8px; font-size: 12px; color: var(--muted); }
#autoBtn.on { color: var(--gold); }
#spdBtn { background: rgba(10,10,20,.6); border-radius: 8px; padding: 3px 8px; font-size: 12px; color: var(--gold); font-weight: 900; margin-left: 4px; }
.bossbar { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); width: 60%; text-align: center; pointer-events: none; }
.bossbar .bn { font-family: var(--display); font-weight: 900; font-size: 14px; text-shadow: 0 1px 2px #000; }
.bossbar .bb { height: 8px; border-radius: 4px; background: rgba(0,0,0,.6); border: 1px solid #000; overflow: hidden; }
.bossbar .bb i { display: block; height: 100%; background: linear-gradient(90deg, #b32a1e, #ff6b4a); width: 100%; }
.bossbar .bt { font-size: 11px; color: #ffd0c4; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.banner { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; background: linear-gradient(transparent 30%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.55) 62%, transparent 75%); }
.banner small { color: var(--cinnabar); font-weight: 900; letter-spacing: .3em; }
.banner b { font-family: var(--display); font-size: 30px; color: #fff; text-shadow: 0 3px 0 #000; }
.banner p { margin: 2px 16px 0; font-size: 13px; }
.bubble { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; max-width: 70%; top: 36px; background: rgba(250,244,230,.94); color: #2a2230; border-radius: 10px; padding: 5px 10px; font-size: 13px; font-weight: 700; pointer-events: none; }
.toast { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); max-width: 90%; background: rgba(12,12,24,.85); border: 1px solid var(--gold); color: var(--text); border-radius: 10px; padding: 4px 12px; font-size: 13px; font-weight: 700; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }

.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin: 0 -10px; padding: 6px 8px max(6px, env(safe-area-inset-bottom, 0px));
  background: linear-gradient(#1b1713, #110e0b); border-top: 1px solid var(--line); }
.tabs button[hidden] { display: none; }
.tabs button { background: transparent; border-radius: 8px; min-height: 48px; padding: 4px 2px; font-family: var(--display); font-weight: 900; font-size: 17px; letter-spacing: .08em; position: relative; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--gold); background: radial-gradient(ellipse at 50% 120%, rgba(195,65,47,.45), transparent 70%); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 3px; height: 4px; border-radius: 3px; background: var(--cinnabar); transform: skewX(-20deg); }
.tabs .dot { position: absolute; top: 6px; right: 12%; width: 9px; height: 9px; border-radius: 50%; background: var(--cinnabar); box-shadow: 0 0 0 2px #15120f; }
#panel { overflow-x: hidden; min-width: 0; background: linear-gradient(180deg, rgba(255,255,255,.025), transparent 120px), var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; align-content: start;
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; min-height: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
.sec { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sec h3 { margin: 0; font-family: var(--display); font-size: 17px; font-weight: 900; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; padding: 3px 10px; font-size: 13px; }
.seg button.on { background: var(--gold); color: #2a1d02; font-weight: 900; }

.ups { display: grid; gap: 8px; }
.up { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--panel2); border-radius: 10px; padding: 8px 10px; }
.up .nm { font-weight: 900; }
.up .nm small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.up .val { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.up .val b { color: var(--jade); }
.buy { min-width: 96px; min-height: 48px; background: #2f6b55; border-radius: 6px; padding: 5px 8px; font-weight: 900; line-height: 1.2; box-shadow: 0 2px 0 #1b4033; }
.buy small { display: block; font-size: 12px; font-weight: 700; color: #d8ffe9; font-variant-numeric: tabular-nums; }
.buy:disabled { background: #3a3f58; box-shadow: none; }
.bonus { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; font-size: 13px; }
.bonus div { background: var(--panel2); border-radius: 8px; padding: 6px 8px; }
.bonus b { color: var(--gold); }

.team { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.team.pteam { grid-template-columns: repeat(2, 1fr); }
.slot { min-width: 0; overflow: hidden; background: var(--panel2); border: 2px dashed var(--line); border-radius: 10px; padding: 6px; text-align: center; min-height: 112px; display: grid; align-content: start; justify-items: center; gap: 2px; }
.slot.sel { border-style: solid; border-color: var(--gold); }
.slot.locked { opacity: .5; }
.slot canvas, .pet canvas, .gi canvas { image-rendering: pixelated; max-width: 100%; height: auto; }
.slot .pn { font-weight: 900; font-size: 13px; }
.stars { color: var(--gold); font-size: 12px; letter-spacing: 1px; font-weight: 400; }
.stars .off { color: #4a4f6c; }
.mini { background: #3d362d; border-radius: 6px; padding: 6px 12px; min-height: 36px; font-size: 14px; font-weight: 700; }
.mini.go { background: #2f6b55; }
.mini.warn { background: #7a3426; }
.big { background: var(--cinnabar); color: #fff6ea; border-radius: 6px; padding: 10px 18px; min-height: 46px; font-family: var(--display); font-weight: 900; font-size: 17px; letter-spacing: .06em; box-shadow: 0 3px 0 #6e2219, inset 0 0 0 1px rgba(255,255,255,.12); }
.big:disabled { background: #3d362d; color: var(--muted); box-shadow: none; }
.pseg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0 8px; }
.pseg button { background: var(--panel2); color: var(--text); border: 2px solid var(--line); border-radius: 10px; padding: 10px; font-weight: 900; font-size: 16px; }
.pseg button.on { border-color: var(--gold); color: var(--gold); }
.pseg button:disabled { opacity: .5; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.chips button { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-weight: 800; color: var(--text); }
.chips button.on { border-color: var(--gold); background: var(--ink); }
.pgrid, .pseg, .chips, .team { min-width: 0; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-bottom: 8px; }
.pgrid.small { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }
.pc { position: relative; background: var(--panel2); border: 2px solid var(--line); border-radius: 10px; padding: 6px 4px; text-align: center; display: grid; justify-items: center; gap: 2px; cursor: pointer; }
.pc.on { box-shadow: 0 0 0 2px var(--gold) inset; }
.pc.un { padding: 2px; opacity: .6; border-width: 1px; }
.pc canvas { max-width: 100%; height: auto; }
.pc .pn { font-weight: 900; font-size: 14px; line-height: 1.2; }
.pc .sub, .slot .sub { font-size: 12px; }
.pc .tag { position: absolute; top: 3px; right: 3px; background: var(--gold); color: #2a2018; font-size: 11px; font-weight: 900; border-radius: 6px; padding: 1px 5px; }
.slot[data-pd] { cursor: pointer; }
.pdetail { text-align: center; }
.pdetail canvas { display: block; margin: 0 auto 4px; }
.pets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pet { background: var(--panel2); border-radius: 10px; padding: 8px; display: grid; grid-template-columns: 64px 1fr; gap: 6px; align-items: start; border-left: 4px solid var(--line); }
.pet .pn { font-weight: 900; }
.pet .rr { font-size: 11px; font-weight: 700; }
.pet .sk { font-size: 12px; color: var(--muted); line-height: 1.35; }
.pet .sk b { color: var(--text); }
.pet .act { grid-column: 1 / -1; display: flex; gap: 6px; justify-content: flex-end; }

.dps { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.dpsHead { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.dpsHead b { color: var(--gold); font-size: 15px; }
.dpsRow { display: grid; grid-template-columns: 7.5em 1fr 6.5em; gap: 6px; align-items: center; font-size: 14px; }
.dpsRow .dn { font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dpsRow .dn small { font-weight: 400; color: var(--muted); font-size: 11px; margin-right: 4px; }
.dpsRow .db { height: 12px; background: rgba(0,0,0,.3); border-radius: 6px; overflow: hidden; }
.dpsRow .db i { display: block; height: 100%; background: linear-gradient(90deg, #c98a2b, #f2c14e); border-radius: 6px; }
.dpsRow .dv { text-align: right; font-variant-numeric: tabular-nums; }
.dpsRow .dv small { color: var(--muted); margin-left: 4px; font-size: 11px; }
.gears { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 8px; }
.gi { display: flex; flex-direction: column; gap: 4px; background: var(--panel2); border-radius: 10px; padding: 6px 8px; min-width: 0; }
.gi .gtop { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: center; }
.gi .gn { font-weight: 900; }
.gi.on { box-shadow: 0 0 0 2px var(--gold) inset; }
.gi .gn .tag { margin-left: 6px; background: var(--gold); color: #2a2018; font-size: 11px; border-radius: 6px; padding: 1px 5px; vertical-align: 1px; }
.gi .gd { font-size: 12px; color: var(--muted); line-height: 1.35; }
.gi .ga { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: auto; padding-top: 2px; }
.gi .ga button { width: 100%; white-space: nowrap; }
.gslots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#modal textarea { background: var(--ink); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px; font-family: monospace; resize: vertical; }
.gslot { background: var(--panel2); border: 2px dashed var(--line); border-radius: 10px; padding: 6px; text-align: center; min-height: 84px; display: grid; align-content: center; justify-items: center; gap: 2px; font-size: 13px; }
.gslot.sel { border-style: solid; border-color: var(--gold); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.stats div { background: var(--panel2); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.stats b { display: block; color: var(--text); font-size: 17px; font-variant-numeric: tabular-nums; }
.outfits { display: grid; gap: 6px; }
.of { background: var(--panel2); border-radius: 10px; padding: 6px 8px; display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center; border: 2px solid transparent; }
.of.on { border-color: var(--gold); }
.of .pn { font-weight: 900; }
.of .sk { font-size: 12px; color: var(--muted); line-height: 1.35; }
.of.locked .pn { color: var(--muted); }
.of canvas { image-rendering: pixelated; }
.looks { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.looks button { background: var(--panel2); border: 2px solid transparent; border-radius: 10px; padding: 4px; font-size: 12px; display: grid; justify-items: center; }
.looks button.on { border-color: var(--gold); }
.looks canvas { image-rendering: pixelated; }

#modal { position: fixed; inset: 0; background: rgba(5,5,12,.72); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { background: linear-gradient(180deg, #2a241d, var(--panel) 30%); border: 2px solid #8a6a3a; border-radius: 4px; padding: 20px 16px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.6); width: min(440px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 10px; text-align: center; justify-items: center; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 22px; color: var(--gold); }

      var c = root.querySelector('#eggC'), x = c.getContext('2d'), t = 0;
      var timer = setInterval(function () {
        t++; x.clearRect(0, 0, 96, 120);
        var sh = t < 14 ? Math.round(Math.sin(t * 1.7) * Math.min(6, t / 2)) : 0;
        var eg = INK && INK.egg(p.rar), shell = INK && INK.egg('shell');
        if (eg) { var ek = Math.min(80 / eg.naturalWidth, 100 / eg.naturalHeight); x.save(); x.translate(48 + sh, 112); x.rotate(sh * 0.02); x.drawImage(eg, -eg.naturalWidth * ek / 2, -eg.naturalHeight * ek, eg.naturalWidth * ek, eg.naturalHeight * ek); if (t > 8 && shell) { x.globalAlpha = Math.min(1, (t - 8) / 4); x.drawImage(shell, -eg.naturalWidth * ek / 2, -eg.naturalHeight * ek, eg.naturalWidth * ek, eg.naturalHeight * ek); } x.restore(); }

        }
        if (t > 8 && !(eg && shell)) { x.strokeStyle = '#3a2a20'; x.lineWidth = 3; x.beginPath(); x.moveTo(26 + sh, 60); x.lineTo(40 + sh, 54); x.lineTo(48 + sh, 64); x.lineTo(58 + sh, 52); x.lineTo(70 + sh, 60); x.stroke(); }
        if (t === 16) { clearInterval(timer); reveal(); }
      }, 70);

      root.querySelector('h2').insertAdjacentHTML('afterend', '<p class="note" id="skipNote">（點蛋可以跳過）</p>');
      c.addEventListener('click', function () { if (t < 16) { t = 16; clearInterval(timer); reveal(); } });
      function reveal() {
        var sn = root.querySelector('#skipNote'); if (sn) sn.remove();

            '<div class="btns">' + (C.S.eggs > 0 ? '<button class="big" type="button" data-m="hatch">再孵一顆（剩 ' + C.S.eggs + '）</button>' : '') + '<button class="mini" type="button" data-m="close" style="padding:8px 16px">好</button></div>';

        root.querySelector('#hatchRes').innerHTML = '<canvas id="petC"></canvas><p style="font-family:var(--display);font-weight:900;font-size:22px;color:' + rar.color + '">' + esc(p.name) + '</p>' +
          '<p class="stars">' + stars(C.S.pets[p.key].star) + '　' + rar.name + '</p><p class="say">' + esc(p.hello) + '</p><p>' + esc(sub) + '</p><p class="note">招式「' + esc(p.skill) + '」：' + esc(p.desc) + '</p>' +
          '<div class="btns">' + (C.S.eggs > 0 ? '<button class="big" type="button" data-m="hatch">再孵一顆（剩 ' + C.S.eggs + '）</button>' : '') + '<button class="mini" type="button" data-m="close" style="padding:8px 16px">好</button></div>';

  // ───────── 面板 ─────────
  var tab = 'train', mult = 1, petSlot = 0, gearSlot = 0, updaters = [];
  function render() {

  function statText(k, st) {
    if (k === 'atk' || k === 'hp') return fmt(st[k]);
    if (k === 'reg') return fmt(st.reg) + '/秒';
    if (k === 'spd') return st.spd.toFixed(2) + ' 下/秒';
    if (k === 'crit') return Math.round(st.crit * 100) + '%';
    return Math.round(st.cd * 100) + '%';
  }
  function plan(k) {
    var u = C.upInfo(k), n = 0, cost = 0, L = u.lv, max = mult === 'max' ? 9999 : mult;
    var c = C.BAL.cost[k];
    while (n < max && (u.max === undefined || L < u.max)) {
      var cc = Math.ceil(c[0] * Math.pow(c[1], L));
      if (mult === 'max' && cost + cc > C.S.gold) break;
      cost += cc; L++; n++;
    }
    if (mult === 'max' && n === 0) { n = 1; cost = u.cost; }
    return { n: n, cost: cost, maxed: u.maxed };
  }
  function trainHtml() {
    var h = '<div class="sec"><h3>修煉</h3><div class="seg" role="group" aria-label="一次升幾級">' +
      [[1, '×1'], [10, '×10'], ['max', '最大']].map(function (m) { return '<button type="button" data-mult="' + m[0] + '" class="' + (mult === m[0] ? 'on' : '') + '">' + m[1] + '</button>'; }).join('') + '</div></div><div class="ups">';

        '<button class="buy" type="button" data-buy="' + u.key + '" id="buy_' + u.key + '">升級<small id="cost_' + u.key + '"></small></button></div>';
    });
    h += '</div><div class="bonus" id="bonus"></div>';
    return h;
  }
  // 傷害統計：主角、神獸、夥伴、法器各打了多少
  var dpsT = 0;
  function dpsName(k) {
    var t = k.slice(0, 2), key = k.slice(2);

  function updDps() {
    var box = $('dpsBox'); if (!box) return;

    var d = C.dpsStats(), tot = 0, rows = [];

    if (d.t < 1 || !tot) { box.innerHTML = '<p class="note">還沒打到妖怪，打一下再來看。</p>'; return; }
    rows.sort(function (a, b) { return b[1] - a[1]; });

      return '<div class="dpsRow"><span class="dn"><small>' + nm[1] + '</small>' + esc(nm[0]) + '</span><span class="db"><i style="width:' + Math.max(2, r[1] / top * 100).toFixed(1) + '%"></i></span><span class="dv">' + fmt(r[1] / d.t) + '<small>' + Math.round(r[1] / tot * 100) + '%</small></span></div>';
    }).join('') + (C.S.testGod ? '<p class="note" style="color:#ff8a8a">無敵模式開著：傷害被放大，比例不準，要看平衡請先關掉。</p>' : '');
  }
  function updTrain() {
    var st = C.stats();
    D.UPGRADES.forEach(function (u) {
      var k = u.key, pl = plan(k), info = C.upInfo(k);
      $('lv_' + k).textContent = 'Lv.' + info.lv + (info.max !== undefined ? ' / ' + info.max : '');

      var save0 = C.S.lv[k]; C.S.lv[k] = save0 + pl.n; var nx = C.stats(); C.S.lv[k] = save0;
      $('val_' + k).innerHTML = statText(k, st) + ' → <b>' + statText(k, nx) + '</b>';

      '<div>絕招「秋風起」 <b>' + (C.S.realm >= 3 ? '已學會' : '練氣四層學會') + '</b></div><div>法器格 <b>' + slots + ' / 3</b>' + (slots < 3 ? '（' + (slots < 2 ? '築基' : '金丹') + '再加一格）' : '') + '</div>';
  }
  // 夥伴（西遊篇、封神篇的人物）
  // 神獸分頁（泓 v31）：上面切換「神獸／夥伴」，出戰格在最上面，下面只排已經有的（大圖小卡），
  // 還沒遇到的縮成一排剪影；點卡片打開詳細視窗，在視窗裡選第幾格出戰、升星、升級
  var partnerSlot = 0, petView = 'pets', petFilter = 'all';
  var RAR_ORDER = { legend: 0, epic: 1, rare: 2, common: 3, start: 4 };

      if (d.join) {
        var p = C.PET_BY[d.join], s = C.S.pets[d.join];
        modal('<h2>' + esc(p.name) + (d.boss && d.boss.name !== p.name ? '加入了！' : '被你打服了！') + '</h2><canvas id="joinC"></canvas><p class="say">' + esc(p.hello) + '</p><p>' + (s.star === 1 && s.dup === 0 ? esc(p.name) + '加入了神獸圖鑑，可以帶牠出戰。' : '牠又跟上來了，算一次重複。') + '</p><div class="btns"><button class="big" type="button" data-m="close">太好了</button></div>',
          function (root) { anims.push(showChar(root.querySelector('#joinC'), p.key, 2)); });
      }
      if (d.pJoin) {
        var pj = C.PART_BY[d.pJoin];
        modal('<h2>' + esc(pj.name) + '加入了！</h2><canvas id="pjC"></canvas><p class="say">' + esc(pj.hello) + '</p><p>夥伴格打開了，' + esc(pj.name) + '已經站上第 1 格，會跟你一起打。</p><p class="note">招式「' + esc(pj.skill) + '」：' + esc(pj.desc) + '</p><div class="btns"><button class="big" type="button" data-m="close">一起出發</button></div>',
          function (root) { anims.push(showChar(root.querySelector('#pjC'), pj.key, 2)); });
      }
      if (d.pOpen && d.pOpen.length) {
        var names = d.pOpen.map(function (k) { return C.PART_BY[k].name; }).join('、');
        modal('<h2>' + esc(names) + '跑進靈獸蛋裡了！</h2><canvas id="ptC"></canvas><p class="say">' + esc(d.boss.name) + '：「好啦好啦，算你厲害。」</p><p>從現在開始，孵靈獸蛋有機會抽到<b>' + esc(names) + '</b>，抽到就能當夥伴。</p><p class="note">夥伴格打完南天門才會打開。</p><div class="btns"><button class="big" type="button" data-m="close">去孵蛋</button></div>',
          function (root) { anims.push(showChar(root.querySelector('#ptC'), d.pOpen[0], 2)); });
      }
      var si = C.stageInfo();
      if (si.k === 0 && si.area.chapter && (si.a === 0 || D.AREAS[si.a - 1].chapter !== si.area.chapter)) setTimeout(function () { toast('新篇章：' + si.area.chapter + '！', 4); }, 800);
      if (si.k === 0) setTimeout(function () { bubble('來到了「' + si.title + '」。' + (si.g === 10 ? '墨老頭：「這裡的蘑菇不要亂吃。」' : '')); }, 1300);
      if (tab === 'pets' || tab === 'log') render();
      save();
    } else if (type === 'bossFail') toast((d.why === 'time' ? '時間到，首領還沒倒！' : '首領太強了！') + bossHint(d.boss, '先刷怪，去「修煉」升攻擊再試試'), 5);
    else if (type === 'heroDown') toast(d.boss ? '被首領打倒了⋯⋯' + bossHint(d.def, '去「修煉」升生命和攻擊再試試') : '被打倒了⋯⋯先在這一關多刷一下', 5);
    else if (type === 'system') {
      var sy = d.s;
      if (sy.tab === 'skill') $('dotSkill').hidden = false;
      modal('<h2>新的修行方式：' + esc(sy.name) + '</h2><p>' + esc(sy.desc) + '</p><div class="btns"><button class="big" type="button" data-m="goTab" data-tab="' + sy.tab + '">去看看</button><button class="mini" type="button" data-m="close" style="padding:8px 16px">等一下</button></div>');
      save();
    }
    else if (type === 'dunStart') { bubble(d.d.say, 4); if (d.el) toast('今天的五行秘境：全是「' + D.ELEMENTS[d.el].name + '」屬性的妖怪，用剋牠的屬性打！', 4); }
    else if (type === 'dunEnd') {
      var rr = D.RES[d.d.res];
      modal('<h2>' + esc(d.d.name) + '：' + (d.why === 'time' ? '時間到！' : '被打出來了！') + '</h2><p>打了 <b>' + d.depth + '</b> 波（最佳 ' + d.best + ' 波）</p><p>拿到 <b style="color:' + rr.color + '">' + rr.name + ' ×' + d.got + '</b></p><div class="btns"><button class="big" type="button" data-m="close">收下</button></div>');
      save(); if (tab === 'skill') render();
    }
    else if (type === 'bossStart') bubbleT = 0;
    else if (type === 'traitIntro') toast('新妖怪「' + d.e.name + '」' + D.TRAITS[d.t].name + '：' + D.TRAITS[d.t].tip, 4);
    else if (type === 'outfit') {
      var o = d.o;
      modal('<h2>解鎖道袍：' + esc(o.name) + '</h2><canvas id="ofC"></canvas><p class="say">' + esc(o.say) + '</p><p>能力：<b>' + esc(o.desc) + '</b></p><p class="note">一次只能穿一件，之後可以在「紀錄」分頁換。</p>' +
        '<div class="btns"><button class="big" type="button" data-m="wear" data-k="' + o.key + '">馬上穿</button><button class="mini" type="button" data-m="close" style="padding:8px 16px">先不要</button></div>',
        function (root) { var c = root.querySelector('#ofC'); portrait(c, 'hero', 4, { look: fullLook(o.key) }); c.style.width = '108px'; });
      save();
    }
    else if (type === 'bossMove') toast(d.e.name + '使出「' + d.name + '」！' + (MOVE_TIPS[d.id] || ''), 2.4);
  });

  // ───────── 主迴圈 ─────────
  var last = performance.now(), saveT = 0, hudT = 0, updT = 0;
  // 畫圖時半徑變負數，瀏覽器會丟錯誤讓整個遊戲停住；一律當成 0
  var arc0 = CanvasRenderingContext2D.prototype.arc;
  CanvasRenderingContext2D.prototype.arc = function (x, y, r, a, b, c) { return arc0.call(this, x, y, r > 0 ? r : 0, a, b, c); };
  var ell0 = CanvasRenderingContext2D.prototype.ellipse;
  if (ell0) CanvasRenderingContext2D.prototype.ellipse = function (x, y, rx, ry, ro, a, b, c) { return ell0.call(this, x, y, rx > 0 ? rx : 0, ry > 0 ? ry : 0, ro, a, b, c); };
  var loopErrs = 0;
  function loop(now) {
    // 就算某一格出錯，下一格照樣跑，不會整個卡住
    requestAnimationFrame(loop);
    try { tick(now); } catch (er) { if (loopErrs++ < 5 && window.console) console.error(er); }
  }
  function tick(now) {
    var dt = Math.min(0.25, (now - last) / 1000); last = now;
    // 彈窗開著遊戲也繼續跑：彈窗如果出現在看不到的位置，才不會整個像當掉一樣
    if (C.S.started) {
      var gdt = dt * speedNow(), n = Math.ceil(gdt / 0.05);
      for (var i = 0; i < n; i++) C.step(gdt / n);
    }
    ST.update(dt); ST.render();
    hudT -= dt; if (hudT <= 0) { hudT = 0.1; hud(); }
    updT -= dt; if (updT <= 0) { updT = 0.3; updaters.forEach(function (f) { f(); }); }
    saveT += dt; if (saveT > 5) { saveT = 0; if (C.S.started) save(); }
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
    if (bubbleT > 0) { bubbleT -= dt; if (bubbleT <= 0 || !$('bossBar').hidden) { bubbleT = 0; $('bubble').hidden = true; } }
    if (C.S.started && !modalOpen && $('bossBar').hidden) {  // 首領戰時不聊天，免得擋到血條
      chatterT -= dt;
      if (chatterT <= 0) {
        chatterT = 28 + Math.random() * 20;
        var team = C.S.team.filter(function (k) { return k && D.PET_CHATTER[k]; });
        bubble(team.length && Math.random() < 0.5 ? pick(D.PET_CHATTER[pick(team)]) : pick(D.CHATTER));
      }
    }
  }

  // 分頁切走再回來，也算離線
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); if (C.S.started) save(); }
    else if (hiddenAt && C.S.started) { var sec = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; last = performance.now(); if (sec >= 60) doOffline(sec); }
  });
  window.addEventListener('pagehide', function () { if (C.S.started) save(); });

  // ───────── 介面美術（GPT 畫的框、按鈕、圖示）：有圖就換上，沒有就用原本的 CSS ─────────
  function skinUI() {
    if (!INK || !INK.ui || !INK.ui('panel')) return;
    var u = function (k) { return INK.ui(k); }, css = [];
    function frame(sel, k, bw, extra) {
      var d = u(k); if (!d || !d.slice) return;
      css.push(sel + '{border-style:solid;border-width:' + bw + ';border-image:url("' + d.url + '") ' + d.slice.join(' ') + ' fill / ' + bw + ' stretch;background:none;border-radius:0;' + (extra || '') + '}');
    }
    function icon(sel, k, size) { var d = u('ic-' + k); if (d) css.push(sel + '{background:url("' + d.url + '") center/contain no-repeat;width:' + (size || 18) + 'px;height:' + (size || 18) + 'px;transform:none;box-shadow:none;border-radius:0;vertical-align:-4px}'); }
    frame('#panel', 'panel', '14px');
    frame('#modalCard', 'scroll', '18px 22px', 'box-shadow:0 10px 40px rgba(0,0,0,.6);');
    frame('.pc,.slot,.up,.pet,.of,.gslot,.gi,.dun,.pill,.xn', 'card', '9px', 'box-shadow:none;');
    frame('.pc.on', 'card', '9px', 'box-shadow:0 0 0 2px var(--gold);');
    frame('.gi.on', 'card', '9px', 'box-shadow:0 0 0 2px var(--gold);');
    frame('button.big,#breakBtn.ready,#bossBtn', 'btn', '6px 8px', 'color:#fff6e6;text-shadow:0 1px 2px rgba(0,0,0,.6);');
    frame('button.go,.buy', 'btn2', '6px 8px', 'color:#f2fff6;text-shadow:0 1px 2px rgba(0,0,0,.6);');
    frame('button.big:disabled,button.go:disabled,.buy:disabled', 'btn2', '6px 8px', 'filter:grayscale(1) brightness(.7);');
    frame('.tabs button', 'tab', '6px 8px');
    frame('.tabs button[aria-selected=true]', 'tab-on', '6px 8px', 'color:var(--gold);');
    frame('.realmrow .bar', 'bar', '4px 6px');
    var ic = { stone: 'stone', egg: 'egg', iron: 'iron', herb: 'herb' };
    for (var k in ic) icon('.ic.' + k, ic[k]);
    var rs = { page: 'page', herb: 'herb', stone: 'wash', soul: 'soul', blood: 'blood' };
    for (k in rs) icon('.ic.r-' + k, rs[k]);
    var us = { atk: 'atk', hp: 'hp', reg: 'regen', spd: 'spd', crit: 'crit', cd: 'critdmg' };
    for (k in us) icon('.ic.u-' + k, us[k], 22);
    var tabs = { train: 'train', pets: 'pets', gear: 'gear', skill: 'skill', log: 'log' };
    for (k in tabs) { var d = u('ic-' + tabs[k]); if (d) css.push('.tabs button[data-tab=' + k + ']::before{content:"";display:block;margin:0 auto 1px;width:24px;height:24px;background:url("' + d.url + '") center/contain no-repeat}'); }
    var btns = { autoBtn: 'auto', spdBtn: 'speed', bossBtn: 'boss', breakBtn: 'break' };
    for (k in btns) { var d2 = u('ic-' + btns[k]); if (d2) css.push('#' + k + '::before{content:"";display:inline-block;width:16px;height:16px;margin-right:3px;vertical-align:-3px;background:url("' + d2.url + '") center/contain no-repeat}'); }
    var logo = u('logo'); if (logo) css.push('.titlebar .title{color:transparent;background:url("' + logo.url + '") left center/contain no-repeat;min-height:30px;min-width:160px;overflow:hidden;white-space:nowrap}');
    var st = document.createElement('style'); st.id = 'uiSkin'; st.textContent = css.join('\n'); document.head.appendChild(st);
  }
  skinUI();

  // ───────── 開始 ─────────
  var saved = readSave();
  try { C.load(saved); } catch (er) {
    // 主存檔壞掉就讀備份，備份也壞才從頭開始（壞的那份留在備份格不覆蓋）
    if (window.console) console.error(er);
    var bk = null; try { bk = parseSave(localStorage.getItem(BACKUP_KEY)); } catch (e2) {}
    try { C.load(bk); } catch (e3) { C.reset(); }
  }
  ST.init($('cv'));
  if (C.S.look) { C.S.look = hairOf(C.S.look); LOOKS.forEach(function (l, i) { if (JSON.stringify(hairOf(l.look)) === JSON.stringify(C.S.look)) chosenLook = i; }); }
  applyLook();
  requestAnimationFrame(loop);
  if (INK) INK.onReady(function () { render(); });
  render(); hud();
  if (!C.S.started) intro();
  else { C.checkOutfits(); C.checkSystems(); var away = (Date.now() - (C.S.lastSeen || Date.now())) / 1000; if (away >= 60) doOffline(away); }
})(IdleCore, IDLE_DATA, IdleStage, XianxiaSide);

</script>

</body>
</html>
