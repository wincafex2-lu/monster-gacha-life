<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="掃帚守山門">
<meta name="theme-color" content="#2a1d14">
<title>掃帚守山門</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{--ink:#fff8ea;--wood:#5a3a22;--wood2:#7a5030;--wood3:#3a2414;--gold:#ffd86a;--red:#e2523a;--green:#58c46a;--blue:#58a8ff;--sky:#7fd0f2;
--n:#9aa7b4;--r:#4fa3ff;--e:#b06cff;--l:#ffb02e;--s:#7be08a;--panel:#fff6e4;--pink:#2b1d12;--ui:"Noto Sans TC",system-ui,sans-serif;--title:"LXGW WenKai TC","Noto Sans TC",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1d14;color:var(--ink);font-family:var(--ui);touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;inset:0;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.hud>*{pointer-events:auto}
.top{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.chip{background:rgba(40,24,12,.78);border:2px solid rgba(255,216,106,.55);border-radius:12px;padding:5px 10px;font-weight:700;font-size:15px;line-height:1.2;box-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
.stage{min-width:120px}
.stage b{font-family:var(--title);font-size:19px;color:var(--gold)}
.stage .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden}
.stage .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd86a,#ff9a3a);width:0}
.gatehp{flex:1;max-width:340px;margin:0 auto}
.gatehp .lbl{display:flex;justify-content:space-between;font-size:13px}
.gatehp .bar{height:12px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:3px;border:1px solid rgba(255,255,255,.25)}
.gatehp .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3fcf6a,#9cf25a);transition:width .15s}
.gatehp.low .bar i{background:linear-gradient(90deg,#e2523a,#ff9a3a)}
.res{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.res .chip{display:flex;align-items:center;gap:5px;font-size:15px}
.ico{display:inline-block;width:18px;height:18px;border-radius:50%;flex:none}
.ico.coin{background:radial-gradient(circle at 35% 35%,#fff3b0,#f2b21e 55%,#a86a08);box-shadow:inset 0 0 0 2px #c78512}
.ico.gem{border-radius:4px;transform:rotate(45deg) scale(.8);background:linear-gradient(135deg,#d8f8ff,#4ac6ff 50%,#2a62d8)}
.ico.stone{border-radius:5px;background:linear-gradient(135deg,#f3f0e6,#b8ae98 60%,#7f7560)}
.ico.pill{background:radial-gradient(circle at 35% 35%,#ffe0f0,#ff5aa0 55%,#a01e5a)}
.btn{font:inherit;font-weight:800;color:var(--ink);background:linear-gradient(#8a5a34,#5a3a22);border:2px solid #2a170a;border-radius:12px;padding:8px 14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 #2a170a;cursor:pointer;min-height:44px;font-size:16px}
.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 1px 0 #2a170a}
.btn.gold{background:linear-gradient(#ffd86a,#e39a1e);color:#3a2008;border-color:#6b3d06}
.btn.green{background:linear-gradient(#7fe07a,#33a04a);color:#0f2a10;border-color:#174a1c}
.btn.blue{background:linear-gradient(#8fd0ff,#3b7fe0);color:#0a1f3a;border-color:#123a6b}
.btn[disabled]{filter:grayscale(.8) brightness(.8);opacity:.7}
.spd{min-width:52px;padding:4px 8px;min-height:36px;font-size:15px}
.bottom{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.bottom>*{pointer-events:auto}
.ults{display:flex;gap:8px;flex-wrap:wrap}
.ult{position:relative;width:66px;height:66px;border-radius:14px;border:3px solid #2a170a;background:#3a2414;overflow:hidden;padding:0;cursor:pointer;box-shadow:0 3px 0 #2a170a}
.ult .pt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ult .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(20,10,4,.62);pointer-events:none}
.ult .nm{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:800;text-align:center;background:rgba(0,0,0,.55);line-height:16px;pointer-events:none}
.ultw{display:flex;flex-direction:column;align-items:center;gap:3px}
.auto{font:inherit;font-size:12px;font-weight:900;min-width:52px;height:24px;padding:0 6px;border-radius:12px;border:2px solid #2a170a;background:#5a3a22;color:#e8d8c0;cursor:pointer}
.auto.on{background:linear-gradient(#7fe07a,#33a04a);color:#0f2a10}
.ult.ready{border-color:#ffd86a;animation:pulse 1s infinite alternate}
.ult.ready::after{content:"大招";position:absolute;top:2px;right:2px;font-size:11px;font-weight:900;color:#3a2008;background:#ffd86a;border-radius:6px;padding:0 4px}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,216,106,.9),0 3px 0 #2a170a}to{box-shadow:0 0 14px 4px rgba(255,216,106,.9),0 3px 0 #2a170a}}
.menu{margin-left:auto;display:flex;gap:8px}
.menu .btn{min-width:64px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:15px}
.menu .btn small{font-size:10px;font-weight:700;opacity:.85}
.dot{position:relative}
.dot.on::after{content:"";position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff4a3a;border:2px solid #fff}
.banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-family:var(--title);font-size:clamp(30px,6vw,58px);color:#fff4c8;text-shadow:0 3px 0 #7a3a10,0 0 18px rgba(255,160,40,.8),-2px 0 0 #7a3a10,2px 0 0 #7a3a10;pointer-events:none;white-space:nowrap;opacity:0}
.banner.show{animation:ban 1.6s ease-out forwards}
.banner.boss{color:#ffd0c8;text-shadow:0 3px 0 #6a0a0a,0 0 22px rgba(255,40,40,.9),-2px 0 0 #6a0a0a,2px 0 0 #6a0a0a}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.ultname{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-family:var(--title);font-size:clamp(26px,5vw,46px);font-weight:700;pointer-events:none;opacity:0;white-space:nowrap;color:#fff;text-shadow:0 0 12px var(--c,#ffd86a),0 3px 0 rgba(0,0,0,.6)}
.ultname.show{animation:un 1.1s ease-out forwards}
@keyframes un{0%{opacity:0;letter-spacing:.6em}15%{opacity:1;letter-spacing:.12em}75%{opacity:1}100%{opacity:0}}
.bossbar{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 58px);transform:translateX(-50%);width:min(420px,60vw);display:none;pointer-events:none}
.bossbar .lbl{font-family:var(--title);text-align:center;font-size:16px;color:#ffd0c8;text-shadow:0 2px 0 #000}
.bossbar .bar{height:12px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden;border:1px solid rgba(255,180,160,.5)}
.bossbar .bar i{display:block;height:100%;background:linear-gradient(90deg,#c0202a,#ff6a3a);width:100%}
/* panels */
.sheet{position:absolute;inset:0;background:rgba(10,6,3,.55);display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));z-index:5}
.sheet.open{display:flex}
.box{background:var(--panel);color:#3a2414;border:4px solid #5a3a22;border-radius:18px;box-shadow:0 6px 0 #2a170a,0 10px 30px rgba(0,0,0,.5);width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.box header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(#8a5a34,#6a4428);color:var(--ink)}
.box header h2{margin:0;font-family:var(--title);font-size:22px;flex:1}
.box .body{padding:12px 14px;overflow:auto;-webkit-overflow-scrolling:touch}
.x{width:44px;height:44px;border-radius:50%;font-size:22px;padding:0;min-height:0}
.tabs{display:flex;gap:6px}
.tabs .btn{padding:4px 12px;min-height:38px;font-size:15px}
.tabs .btn.on{background:linear-gradient(#ffd86a,#e39a1e);color:#3a2008}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.card{position:relative;border-radius:12px;border:3px solid var(--n);background:linear-gradient(#fff,#efe4cf);aspect-ratio:3/4;overflow:hidden;cursor:pointer;padding:0;font:inherit;color:#3a2414}
.card img{position:absolute;left:50%;bottom:22px;height:76%;transform:translateX(-50%);pointer-events:none}
.card .cn{position:absolute;left:0;right:0;bottom:0;font-size:12px;font-weight:800;background:rgba(255,255,255,.85);padding:2px 0;text-align:center}
.card .lv{position:absolute;left:4px;top:3px;font-size:12px;font-weight:900;background:rgba(58,36,20,.85);color:#fff;border-radius:6px;padding:0 5px}
.card .tier{position:absolute;right:4px;top:3px;font-size:11px;color:#ff9a1e;text-shadow:0 1px 0 #fff}
.card.R{border-color:var(--r)}.card.E{border-color:var(--e);background:linear-gradient(#fbf4ff,#e8d4ff)}.card.L{border-color:var(--l);background:linear-gradient(#fff8dc,#ffe2a0)}.card.S{border-color:var(--s)}
.card.locked{filter:grayscale(1) brightness(.55);cursor:default}
.card.inteam::before{content:"上陣";position:absolute;left:4px;bottom:24px;z-index:1;font-size:11px;font-weight:900;background:#33a04a;color:#fff;border-radius:6px;padding:0 5px}
.card .up{position:absolute;right:4px;bottom:24px;z-index:1;font-size:11px;font-weight:900;background:#ff4a3a;color:#fff;border-radius:6px;padding:0 5px}
.detail{display:flex;gap:14px;flex-wrap:wrap}
.detail .pic{flex:0 0 180px;height:230px;border-radius:14px;background:radial-gradient(circle at 50% 70%,#fff,#e9dcc0);position:relative;border:3px solid var(--n)}
.detail .pic img{position:absolute;left:50%;bottom:10px;height:88%;transform:translateX(-50%)}
.detail .info{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.detail h3{margin:0;font-family:var(--title);font-size:26px}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:1px 8px;color:#fff;background:var(--n);margin-right:4px}
.tag.R{background:var(--r)}.tag.E{background:var(--e)}.tag.L{background:var(--l)}.tag.S{background:#33a04a}
.stat{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px}
.stat b{color:#7a4a20}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cost{display:inline-flex;align-items:center;gap:4px;font-weight:900}
.tiers{display:flex;gap:6px;margin-top:4px}
.tiers span{width:44px;height:56px;border-radius:8px;border:2px solid #cbb998;position:relative;overflow:hidden;background:#fff}
.tiers span img{position:absolute;left:50%;bottom:2px;height:92%;transform:translateX(-50%)}
.tiers span.no img{filter:brightness(0) opacity(.25)}
.tiers span.cur{border-color:#e39a1e;box-shadow:0 0 0 2px #ffd86a}
.gacha{display:flex;flex-direction:column;align-items:center;gap:12px}
.gacha .rates{font-size:13px;color:#7a5a3a;text-align:center}
.pulls{display:grid;grid-template-columns:repeat(5,minmax(0,110px));gap:8px;justify-content:center;min-height:10px}
.pulls .card{animation:flip .45s backwards}
.pulls .card .new{position:absolute;left:4px;top:3px;font-size:11px;font-weight:900;background:#ff4a3a;color:#fff;border-radius:6px;padding:0 5px}
@keyframes flip{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.pulls .card.E{box-shadow:0 0 12px 3px rgba(176,108,255,.8)}.pulls .card.L{box-shadow:0 0 16px 4px rgba(255,176,46,.9)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid #e2d3b4;border-radius:12px;padding:8px}
.item .th{width:64px;height:64px;flex:none;border-radius:10px;background:#efe4cf;position:relative;overflow:hidden}
.item .th img{position:absolute;left:50%;bottom:2px;max-height:94%;max-width:94%;transform:translateX(-50%)}
.item .tx{flex:1;min-width:0}
.item .tx b{font-size:16px}
.item .tx div{font-size:13px;color:#7a5a3a}
.item.lock{opacity:.6}
.gateinfo{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.gateinfo .pic{width:150px;height:140px;position:relative}
.gateinfo .pic img{position:absolute;left:50%;bottom:0;max-height:100%;max-width:100%;transform:translateX(-50%)}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(40,24,12,.9);border:2px solid var(--gold);border-radius:12px;padding:8px 16px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.gift .box{width:min(420px,100%);text-align:center}
.gift .body img{max-height:180px;max-width:80%}
.gift p{margin:6px 0 12px;font-size:16px}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2a1d14;z-index:20;font-family:var(--title);font-size:26px;gap:12px}
#loading .bar{width:min(320px,70vw);height:12px;border-radius:6px;background:#4a3020;overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--gold)}
.ver{position:absolute;right:max(6px,env(safe-area-inset-right));bottom:2px;font-size:10px;opacity:.55;pointer-events:none}
.rotate{display:none;position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:rgba(40,24,12,.88);padding:10px 16px;border-radius:12px;font-weight:700;pointer-events:none;text-align:center}
@media (orientation:portrait) and (max-width:700px){.rotate{display:block}}
@media (max-height:430px){.ult{width:54px;height:54px}.menu .btn{min-width:54px;font-size:14px;min-height:40px}.chip{font-size:13px;padding:3px 8px}.stage b{font-size:16px}.res .chip{font-size:13px}}
</style>
</head>
<body>
<div id="loading"><div>掃帚守山門</div><div class="bar"><i id="ldbar"></i></div></div>
<div id="game">
<canvas id="cv"></canvas>
<div class="hud">
  <div class="top">
    <div class="chip stage"><b id="stageT">第 1 關</b><div class="bar"><i id="waveBar"></i></div></div>
    <div class="chip gatehp" id="gateBox"><div class="lbl"><span id="gateName">山門 Lv1</span><span id="gateHpT">100/100</span></div><div class="bar"><i id="gateBar"></i></div></div>
    <div class="res">
      <div class="chip"><span class="ico coin"></span><span id="coinT">0</span></div>
      <div class="chip"><span class="ico gem"></span><span id="gemT">0</span></div>
      <div class="chip"><span class="ico stone"></span><span id="stoneT">0</span></div>
      <button class="btn spd" id="spdBtn">1×</button>
    </div>
  </div>
  <div class="bossbar" id="bossBar"><div class="lbl" id="bossName">Boss</div><div class="bar"><i id="bossHp"></i></div></div>
  <div class="banner" id="banner"></div>
  <div class="ultname" id="ultName"></div>
  <div class="rotate">把手機轉橫的玩比較大喔</div>
  <div class="bottom">
    <div class="ults" id="ults"></div>
    <div class="menu">
      <button class="btn dot" id="bHero">弟子<small>升級</small></button>
      <button class="btn gold dot" id="bGacha">召喚<small>靈石</small></button>
      <button class="btn dot" id="bGate">山門<small>守城</small></button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="ver">v0.1 試玩版</div>
</div>
<div class="sheet" id="sheet"><div class="box"><header><h2 id="shTitle"></h2><div class="tabs" id="shTabs"></div><button class="btn x" id="shX">✕</button></header><div class="body" id="shBody"></div></div></div>
<div class="sheet gift" id="gift"><div class="box"><header><h2 id="gfTitle">獲得</h2></header><div class="body"><img id="gfImg" alt=""><p id="gfText"></p><button class="btn gold" id="gfOk">太好了！</button></div></div></div>
</div>

const hpBase=s=>14*Math.pow(1.13,s-1);
const dmgBase=s=>2.6*Math.pow(1.09,s-1);
const coinKill=(s,m)=>Math.max(1,Math.round(1.6*Math.pow(1.088,s-1)*m));
const lvCost=lv=>Math.ceil(6*Math.pow(1.12,lv-1));
const gateCost=lv=>Math.ceil(20*Math.pow(1.105,lv-1));
const gateMax=lv=>Math.round(120*Math.pow(1.17,lv-1));
const turCost=lv=>Math.ceil(14*Math.pow(1.13,lv-1));
const lvCap=id=>Math.min(TIER_CAP[S.roster[id].tier],S.gateLv*3+10);
const slots=()=>{let n=2;for(const[l,c]of SLOT_LV)if(S.gateLv>=l)n=c;return n};
const turSlots=()=>{let n=0;for(const[l,c]of TUR_SLOT)if(S.gateLv>=l)n=c;return n};
const tierOf=lv=>lv>=20?3:lv>=10?2:1;
function heroAtk(id){const d=CH[id],r=S.roster[id];const side=(d.role==='melee'||d.role==='tank')?PS.front:(d.role==='ranged'||d.role==='magic')?PS.back:0;return ROLE[d.role].atk*RAR[d.r].mul*Math.pow(1.09,r.lv-1)*Math.pow(1.5,r.tier-1)*(B.buff>0?1.3:1)*(1+PS.atk+side)*(1+.03*(r.brk||0))}
function turAtk(k){const l=S.tur[k].lv;return TUR[k].atk*Math.pow(1.1,l-1)*Math.pow(1.3,tierOf(l)-1)}
function arrDps(k){return ARR[k].dps*Math.pow(1.1,S.arr[k].lv-1)}
function beastAtk(k){return BEAST[k].atk*Math.pow(1.1,S.beast[k].lv-1)}
function towerKey(){const n=slots();return 'tower'+Math.min(8,n)}
function gateKey(broken){const g=Math.min(5,1+Math.floor((S.gateLv-1)/10));return `gate${g}_${broken?'broken':'ok'}`}
const fmt=n=>n<1e4?String(Math.floor(n)):n<1e6?(n/1e3).toFixed(n<1e5?1:0)+'K':n<1e9?(n/1e6).toFixed(1)+'M':(n/1e9).toFixed(1)+'B';

function layout(){
 const tk=towerKey(),tm=MAN[tk];if(!tm)return;
 const tw=tm[0]/2,th=tm[1]/2,tx=20;
 const gk=gateKey(false),gm=MAN[gk];const gw=gm[0]/2;
 const gx=tx+tw-gw/3+gw/2;
 L={tk,tx,tw,th,spots:tm[4].map(([sx,sy])=>[tx+sx/2,G-(th-sy/2)]),gk,gx,gw,front:gx+gw/2};
 L.tur=[L.front+38,L.front+118,L.front+198];
 L.beastX=L.front+(turSlots()>=2?270:200);
 L.arr0=L.front-30;L.arr1=L.beastX+90;L.arrX=(L.arr0+L.arr1)/2;L.arrR=(L.arr1-L.arr0)/2;
 B.heroes.forEach((h,i)=>{const s=L.spots[i];if(s){h.x=s[0];h.y=s[1]}});
 B.turrets.forEach((t,i)=>t.x=L.tur[i]);

 B.turrets=S.turTeam.slice(0,turSlots()).map((k,i)=>({k,x:L.tur[i],cd:.6,anim:0}));
 B.beast=S.beastOn?{k:S.beastOn,x:L.beastX,cd:1,anim:0}:null;

function startStage(){
 const s=S.stage;B.enemies=[];B.proj=[];B.spawnQ=[];B.killed=0;B.boss=null;B.stageFail=false;
 B.gateMax=Math.round(gateMax(S.gateLv)*(1+PS.hp));B.gateHp=B.gateMax;
 const pool=Object.keys(MON).filter(k=>MON[k].from<=s);
 const n=Math.min(24,5+Math.floor(s*0.6));
 for(let i=0;i<n;i++){
  let k=pool[Math.floor(Math.random()*pool.length)];
  if(i<2&&s<4)k='slime';

 B.total=B.spawnQ.length;B.spawnT=0;B.state='run';
 B.heroes.forEach(h=>h.charge=Math.max(h.charge,0));

}
function spawn(q){
 const s=S.stage;
 if(q.k==='BOSS'){
  const b=BOSS[(Math.floor(s/10)-1)%BOSS.length];const cyc=Math.floor((s/10-1)/BOSS.length);
  const e=mkEnemy(b.k,true);e.n=b.n+(cyc?` ${'ⅡⅢⅣⅤ'[Math.min(3,cyc-1)]}`:'');B.boss=e;
  document.getElementById('bossName').textContent=e.n;document.getElementById('bossBar').style.display='block';
  shake(8);return;
 }
 mkEnemy(q.k,false);
}
function mkEnemy(k,boss){
 const s=S.stage;const m=boss?{hp:26,spd:26,dmg:4,coin:20,fly:0}:MON[k];
 const hp=hpBase(s)*m.hp;
 const key=boss?'k_'+k:(k==='bat'?'m_bat_0':'m_'+k);
 const e={k,boss,key,x:VW+60+Math.random()*30,y:G+(m.fly?-150-Math.random()*30:(Math.random()*14-7)),hp,max:hp,spd:m.spd*1.35*(0.92+Math.random()*.16),dmg:dmgBase(s)*m.dmg,coin:Math.round(coinKill(s,m.coin)*(1+PS.coin)),
  fly:!!m.fly,hop:!!m.hop,state:'walk',t:Math.random()*6,at:0,flash:0,stun:0,slow:0,slowT:0,burn:0,dead:0,stop:L.front+6+Math.random()*46+(boss?40:0),kb:0};
 const mm=MAN[key];e.w=mm[0]/2;e.h=mm[1]/2;e.ax=mm[2]/2;e.ay=mm[3]/2;
 e.frames=boss?['k_'+k+'_windup','k_'+k+'_strike']:[1,2,3].map(i=>'m_'+k+'_a'+i).filter(f=>MAN[f]);

}

/* ---------- 主迴圈 ---------- */
let last=performance.now(),acc=0;
function frame(now){const real=Math.min(.05,(now-last)/1000);last=now;
 let dt=real*B.speed;
 if(B.hitstop>0){B.hitstop-=real;dt*=.08}
 const n=B.speed>1?2:1;for(let i=0;i<n;i++)step(dt/n);
 draw(real);requestAnimationFrame(frame)}
function step(dt){
 B.time+=dt;if(B.buff>0)B.buff-=dt;
 // 關卡狀態
 if(B.state==='run'){
  if(B.spawnQ.length){B.spawnT+=dt;if(B.spawnT>=B.spawnQ[0].delay){B.spawnT=0;spawn(B.spawnQ.shift())}}
  else if(!B.enemies.some(e=>!e.dead)){B.state='win';B.stateT=0;stageWin()}
 }else{B.stateT+=dt;if(B.stateT>(B.state==='win'?1.8:2.6)&&!giftOpen){if(B.state==='lose'){}startStage()}}
 // 山門回血（輔助）
 let regen=PS.regen*B.gateMax;
 if(B.state==='run'&&B.gateHp>0)B.gateHp=Math.min(B.gateMax,B.gateHp+regen*dt);
 // 英雄
 const alive=B.enemies.filter(e=>!e.dead&&e.x<VW+20);
 alive.sort((a,b)=>a.x-b.x);
 for(const h of B.heroes){
  if(h.anim){h.anim.t+=dt;const A=h.anim;
   if(A.type==='atk'){if(!A.fired&&A.t>=.2){A.fired=1;heroFire(h)}if(A.t>.5)h.anim=null}
   else if(A.type==='ult'){if(!A.fired&&A.t>=.78){A.fired=1;doUlt(h)}if(A.t>1.2)h.anim=null}
  }
  h.cd-=dt;
  if(h.cd<=0&&!h.anim&&B.state==='run'){const R=ROLE[CH[h.id].role];const tg=alive.find(e=>e.x-h.x<=R.range);if(tg){h.cd=1/R.rate;h.anim={type:'atk',t:0,target:tg}}}
  if(h.charge>=100&&S.auto&&S.auto[h.id]&&!h.anim&&B.state==='run'&&alive.length)castUlt(B.heroes.indexOf(h));
  if(B.state==='run')h.charge=Math.min(100,h.charge+dt*100/16*(1+PS.charge));
 }
 // 塔
 for(const t of B.turrets){t.anim=Math.max(0,t.anim-dt);t.cd-=dt;
  if(t.cd<=0&&alive.length&&B.state==='run'){const d=TUR[t.k];t.cd=1/d.rate;t.anim=.25;turFire(t,alive)}}
 // 神獸
 if(B.beast){const b=B.beast;b.anim=Math.max(0,b.anim-dt);b.cd-=dt;
  const near=alive.filter(e=>!e.fly&&e.x>b.x-20&&e.x<b.x+190);
  if(b.cd<=0&&near.length&&B.state==='run'){b.cd=1/BEAST[b.k].rate;b.anim=.45;
   b.hitAt=.18;b.targets=near.slice(0,3)}
  if(b.hitAt!=null){b.hitAt-=dt;if(b.hitAt<=0){b.hitAt=null;const a=beastAtk(b.k);b.targets.forEach(e=>hit(e,a,{c:'#ffffff',kb:14}));addFx({k:'claw',x:b.x+90,y:G-60,life:.25});shake(2)}}
 }
 // 陣法
 if(B.arr&&B.state==='run'){const a=B.arr;a.t+=dt;a.tick+=dt;if(a.tick>=.5){a.tick=0;const dps=arrDps(a.k);
  B.enemies.forEach(e=>{if(!e.dead&&!e.fly&&Math.abs(e.x-a.x)<L.arrR)hit(e,dps*.5,{c:'#ffa04a',small:1})})}}
 // 敵人
 for(const e of B.enemies){
  if(e.dead){e.dead+=dt;continue}
  e.t+=dt;e.flash=Math.max(0,e.flash-dt);
  if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slow=0}
  if(e.kb>0){const k=Math.min(e.kb,dt*260);e.x+=k;e.kb-=k}
  if(e.stun>0){e.stun-=dt;continue}
  if(e.state==='walk'){const v=e.spd*(1-e.slow)*(PS.slow&&e.x<L.front+450?1-PS.slow:1);e.x-=v*dt;
   if(e.x-e.w*.3<=e.stop){e.state='atk';e.at=0}}
  else{e.at+=dt*(1-e.slow*.5);const cyc=e.boss?2.2:1.3;
   const hitT=e.boss?.95:(e.frames.length?.55:.45);
   if(!e.didHit&&e.at>=hitT){e.didHit=1;gateDamage(e.dmg);if(e.boss){shake(9);B.hitstop=.06;addFx({k:'dust',x:e.x-e.w*.35,y:G,life:.5})}}
   if(e.at>=cyc){e.at=0;e.didHit=0}
   if(e.x-e.w*.3>e.stop+4)e.state='walk';
  }
 }
 B.enemies=B.enemies.filter(e=>!(e.dead>.5));
 // 投射物
 for(const p of B.proj){p.life-=dt;
  if(p.target&&!p.target.dead){p.tx=p.target.x-(p.target.fly?0:0);p.ty=p.target.y-p.target.ay*.45}
  if(p.arc){p.t+=dt;const k=Math.min(1,p.t/p.dur);p.x=p.sx+(p.tx-p.sx)*k;p.y=p.sy+(p.ty-p.sy)*k-Math.sin(k*Math.PI)*p.arc;if(k>=1)projHit(p)}
  else{const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),sp=p.spd*dt;
   p.ang=Math.atan2(dy,dx);if(d<=sp+6)projHit(p);else{p.x+=dx/d*sp;p.y+=dy/d*sp}}
 }
 B.proj=B.proj.filter(p=>!p.done&&p.life>0);
 // 特效
 for(const f of B.fx){f.t=(f.t||0)+dt;if(f.upd)f.upd(f,dt)}
 B.fx=B.fx.filter(f=>f.t<f.life);
 for(const t of B.txt){t.t+=dt;t.y-=dt*40}
 B.txt=B.txt.filter(t=>t.t<.8);
 B.shake=Math.max(0,B.shake-dt*30);
}
function heroFire(h){
 const d=CH[h.id],R=ROLE[d.role];let tg=h.anim.target;
 if(!tg||tg.dead){const a=B.enemies.filter(e=>!e.dead);if(!a.length)return;tg=a.reduce((m,e)=>e.x<m.x?e:m)}
 const p={x:h.x+18,y:h.y-70,sx:h.x+18,sy:h.y-70,tx:tg.x,ty:tg.y-tg.ay*.45,target:tg,spd:900,life:3,dmg:heroAtk(h.id),kind:R.proj,c:d.c,aoe:R.aoe||0,knock:R.knock||0,from:h};
 if(R.proj==='pill'||R.proj==='orb'&&false){p.arc=140;p.t=0;p.dur=.55}
 if(R.proj==='slash')p.spd=1100;
 if(R.proj==='orb')p.spd=700;
 B.proj.push(p);h.charge=Math.min(100,h.charge+2.5);
 if(R.proj==='arrow'||R.proj==='spear')addFx({k:'muzzle',x:p.x+10,y:p.y,life:.12,c:d.c});
}

 lastPulls.forEach((p,i)=>{const d=CH[p.id];h+=`<div class="card ${d.r}" style="animation-delay:${i*.08}s"><img src="${charImg(p.id,1)}" alt="">${p.isNew?'<span class="new">新！</span>':''}<span class="cn">${d.n}</span></div>`});
 h+='</div></div>';$('shBody').innerHTML=h;$('g1').onclick=()=>pull(1);$('g10').onclick=()=>pull(10)}
/* 山門 */
function renderGate(){$('shTitle').textContent='山門';$('shTabs').innerHTML='';
 const lv=S.gateLv,c=gateCost(lv);const nx=SLOT_LV.find(([l])=>l>lv),nt=TUR_SLOT.find(([l])=>l>lv);
 let h=`<div class="gateinfo"><div class="pic"><img src="${SRC[gateKey(false)]}" alt=""></div><div class="info" style="flex:1;min-width:200px"><h3 style="margin:0;font-family:var(--title);font-size:24px">山門 Lv${lv}</h3>
 <div class="stat"><b>城門血量</b><span>${fmt(gateMax(lv))} → ${fmt(gateMax(lv+1))}${PS.hp?`（弟子被動再 +${Math.round(PS.hp*100)}%）`:''}</span><b>樓閣站位</b><span>${slots()} 位${nx?`（Lv${nx[0]} 變 ${nx[1]} 位）`:''}</span><b>塔位</b><span>${turSlots()} 座${nt?`（Lv${nt[0]} 變 ${nt[1]} 座）`:''}</span><b>弟子等級上限</b><span>Lv${lv*3+10}</span></div>
 <div class="row" style="margin-top:8px"><button class="btn gold" id="gUp" ${S.stone<c?'disabled':''}>升級山門 <span class="cost"><span class="ico stone"></span>${fmt(c)}</span></button><span style="font-size:13px;color:#7a5a3a">山門石：每次過關都會拿到，Boss 給比較多</span></div></div></div>
 <h3 style="margin:6px 0 8px;font-family:var(--title)">塔（${S.turTeam.length}/${turSlots()}）</h3><div class="list">`;
 for(const k in TUR){const has=S.tur[k];const d=TUR[k];const g=Object.entries(GIFTS).find(([,v])=>v.k===k);
  if(!has){h+=`<div class="item lock"><div class="th"><img src="${SRC['t_'+k+'_1']}" alt="" style="filter:brightness(0) opacity(.35)"></div><div class="tx"><b>${d.n}</b><div>${g?`第 ${g[0]} 關第一次過關送`:'之後的版本開放'}</div></div></div>`;continue}
  const l=has.lv,cc=turCost(l);const on=S.turTeam.includes(k);
  h+=`<div class="item"><div class="th"><img src="${SRC['t_'+k+'_'+tierOf(l)]}" alt=""></div><div class="tx"><b>${d.n} Lv${l}</b><div>${d.d}｜攻擊 ${fmt(turAtk(k))}｜Lv10、Lv20 換外型</div></div>
  <button class="btn green" data-tu="${k}" ${S.coin<cc?'disabled':''}>升級 <span class="cost"><span class="ico coin"></span>${fmt(cc)}</span></button><button class="btn blue" data-tt="${k}">${on?'收起':'擺上'}</button></div>`}
 h+=`</div><h3 style="margin:14px 0 8px;font-family:var(--title)">陣法・神獸</h3><div class="list">`;
 for(const k in ARR){const has=S.arr[k],d=ARR[k];const g=Object.entries(GIFTS).find(([,v])=>v.k===k);
  if(!has){h+=`<div class="item lock"><div class="th"><img src="${SRC['i_'+k]}" alt="" style="filter:grayscale(1) opacity(.4)"></div><div class="tx"><b>${d.n}</b><div>第 ${g[0]} 關第一次過關送</div></div></div>`;continue}
  const cc=turCost(has.lv);h+=`<div class="item"><div class="th"><img src="${SRC['i_'+k]}" alt=""></div><div class="tx"><b>${d.n} Lv${has.lv}</b><div>${d.d}｜每秒 ${fmt(arrDps(k))}</div></div><button class="btn green" data-au="${k}" ${S.coin<cc?'disabled':''}>升級 <span class="cost"><span class="ico coin"></span>${fmt(cc)}</span></button></div>`}
 for(const k in BEAST){const has=S.beast[k],d=BEAST[k];const g=Object.entries(GIFTS).find(([,v])=>v.k===k);
  if(!has){h+=`<div class="item lock"><div class="th"><img src="${SRC['b_'+k]}" alt="" style="filter:brightness(0) opacity(.35)"></div><div class="tx"><b>神獸 ${d.n}</b><div>第 ${g[0]} 關打倒 Boss 送</div></div></div>`;continue}
  const cc=Math.ceil(turCost(has.lv)*1.4);h+=`<div class="item"><div class="th"><img src="${SRC['b_'+k]}" alt=""></div><div class="tx"><b>神獸 ${d.n} Lv${has.lv}</b><div>${d.d}｜攻擊 ${fmt(beastAtk(k))}</div></div><button class="btn green" data-bu="${k}" ${S.coin<cc?'disabled':''}>升級 <span class="cost"><span class="ico coin"></span>${fmt(cc)}</span></button></div>`}
 h+='</div>';$('shBody').innerHTML=h;
 $('gUp').onclick=()=>{if(S.stone<c)return;S.stone-=c;S.gateLv++;const before=slots();refreshField();B.gateHp=B.gateMax;toast(`山門升到 Lv${S.gateLv}！`);renderGate();updHud()};
 $('shBody').querySelectorAll('[data-tu]').forEach(b=>b.onclick=()=>{const k=b.dataset.tu,cc=turCost(S.tur[k].lv);if(S.coin<cc)return;S.coin-=cc;const t0=tierOf(S.tur[k].lv);S.tur[k].lv++;if(tierOf(S.tur[k].lv)>t0)toast(`${TUR[k].n} 進化了！`);persist();renderGate();updLive()});
 $('shBody').querySelectorAll('[data-tt]').forEach(b=>b.onclick=()=>{const k=b.dataset.tt;if(S.turTeam.includes(k))S.turTeam=S.turTeam.filter(x=>x!==k);else{if(S.turTeam.length>=turSlots()){toast(`塔位只有 ${turSlots()} 座，升級山門可以多擺`);return}S.turTeam.push(k)}refreshField();renderGate()});
 $('shBody').querySelectorAll('[data-au]').forEach(b=>b.onclick=()=>{const k=b.dataset.au,cc=turCost(S.arr[k].lv);if(S.coin<cc)return;S.coin-=cc;S.arr[k].lv++;persist();renderGate();updLive()});
 $('shBody').querySelectorAll('[data-bu]').forEach(b=>b.onclick=()=>{const k=b.dataset.bu,cc=Math.ceil(turCost(S.beast[k].lv)*1.4);if(S.coin<cc)return;S.coin-=cc;S.beast[k].lv++;persist();renderGate();updLive()});
}
/* 獎勵 */
let giftOpen=false;
function giveGift(g){let title,img,text;
 if(g.type==='tur'){S.tur[g.k]={lv:1};if(S.turTeam.length<turSlots())S.turTeam.push(g.k);title='獲得新的塔！';img=SRC['t_'+g.k+'_1'];text=`${TUR[g.k].n}：${TUR[g.k].d}。擺在山門前面自動攻擊。`}
 else if(g.type==='arr'){S.arr[g.k]={lv:1};S.arrOn=g.k;title='獲得陣法！';img=SRC['i_'+g.k];text=`${ARR[g.k].n}：${ARR[g.k].d}。`}
 else{S.beast[g.k]={lv:1};S.beastOn=g.k;title='神獸來了！';img=SRC['b_'+g.k];text=`神獸 ${BEAST[g.k].n} 願意守護山門！${BEAST[g.k].d}。`}
 giftOpen=true;$('gfTitle').textContent=title;$('gfImg').src=img;$('gfText').textContent=text;$('gift').classList.add('open');refreshField()}
$('gfOk').onclick=()=>{$('gift').classList.remove('open');giftOpen=false};
/* 離線收穫 */
function offline(){const dt=(Date.now()-(S.seen||Date.now()))/1000;if(dt<120)return;const t=Math.min(dt,12*3600);const s=Math.max(1,S.best);
 const perMin=coinKill(s,1.1)*(5+s*.6)/1.2;const c=Math.round(perMin*t/60*.5);if(c<1)return;S.coin+=c;S.seen=Date.now();
 giftOpen=true;$('gfTitle').textContent='閉關回來了';$('gfImg').src=charImg(S.team[0]);$('gfText').textContent=`你不在的 ${t>=3600?Math.floor(t/3600)+' 小時 ':''}${Math.floor(t%3600/60)} 分鐘，弟子們守住山門，賺到 ${fmt(c)} 銅錢！`;$('gift').classList.add('open');persist()}
/* 啟動 */
loadAll().then(()=>{
 try{const c=document.createElement('canvas');c.width=4;c.height=4;const g=c.getContext('2d');g.drawImage(IMG.bg_meadow,0,0,1536,3,0,0,1,1);const d=g.getImageData(0,0,1,1).data;SKY=`rgb(${d[0]},${d[1]},${d[2]})`}catch(e){}
 $('loading').style.display='none';resize();buildField();startStage();offline();requestAnimationFrame(t=>{last=t;frame(t)});
 window.__B=B;window.__pick=()=>pick;window.__S=S;window.__fast=sec=>{for(let t=0;t<sec;t+=.05){step(.05);if(giftOpen){$('gift').classList.remove('open');giftOpen=false}}};window.__api={levelUp,pull,heroAtk,lvCost,lvCap,gateCost,turCost,refreshField};
});
</script>
</body>
</html>
