<style>
:root{--ink:#fff8ea;--wood:#5a3a22;--wood2:#7a5030;--wood3:#3a2414;--gold:#ffd86a;--red:#e2523a;--green:#58c46a;--blue:#58a8ff;--sky:#7fd0f2;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1d14;color:var(--ink);font-family:var(--ui);touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;inset:0;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.hud>*{pointer-events:auto}
.top{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.chip{background:rgba(40,24,12,.78);border:2px solid rgba(255,216,106,.55);border-radius:12px;padding:5px 10px;font-weight:700;font-size:15px;line-height:1.2;box-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
.stage{min-width:120px}
.stage b{font-family:var(--title);font-size:19px;color:var(--gold)}
.stage .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:4px;overflow:hidden}
.stage .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd86a,#ff9a3a);width:0}
.gatehp{flex:1;max-width:340px;margin:0 auto}
.gatehp .lbl{display:flex;justify-content:space-between;font-size:13px}
.gatehp .bar{height:12px;border-radius:6px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:3px;border:1px solid rgba(255,255,255,.25)}
.gatehp .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3fcf6a,#9cf25a);transition:width .15s}
.gatehp.low .bar i{background:linear-gradient(90deg,#e2523a,#ff9a3a)}
.res{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.res .chip{display:flex;align-items:center;gap:5px;font-size:15px}
.ico{display:inline-block;width:18px;height:18px;border-radius:50%;flex:none}
.ico.coin{background:radial-gradient(circle at 35% 35%,#fff3b0,#f2b21e 55%,#a86a08);box-shadow:inset 0 0 0 2px #c78512}
.ico.gem{border-radius:4px;transform:rotate(45deg) scale(.8);background:linear-gradient(135deg,#d8f8ff,#4ac6ff 50%,#2a62d8)}
.ico.stone{border-radius:5px;background:linear-gradient(135deg,#f3f0e6,#b8ae98 60%,#7f7560)}
.ico.pill{background:radial-gradient(circle at 35% 35%,#ffe0f0,#ff5aa0 55%,#a01e5a)}
.btn{font:inherit;font-weight:800;color:var(--ink);background:linear-gradient(#8a5a34,#5a3a22);border:2px solid #2a170a;border-radius:12px;padding:8px 14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 3px 0 #2a170a;cursor:pointer;min-height:44px;font-size:16px}
.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 1px 0 #2a170a}
.btn.gold{background:linear-gradient(#ffd86a,#e39a1e);color:#3a2008;border-color:#6b3d06}
.btn.green{background:linear-gradient(#7fe07a,#33a04a);color:#0f2a10;border-color:#174a1c}
.btn.blue{background:linear-gradient(#8fd0ff,#3b7fe0);color:#0a1f3a;border-color:#123a6b}
.btn[disabled]{filter:grayscale(.8) brightness(.8);opacity:.7}
.spd{min-width:52px;padding:4px 8px;min-height:36px;font-size:15px}
.bottom{position:absolute;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.bottom>*{pointer-events:auto}
.ults{display:flex;gap:8px;flex-wrap:wrap}
.utog{align-self:flex-end;font:inherit;font-size:13px;font-weight:900;min-width:34px;height:34px;padding:0 6px;border-radius:10px;border:2px solid #2a170a;background:#5a3a22cc;color:#ffe8c0;cursor:pointer}
body.ufold .ults{display:none}
@media (max-height:600px){.ult{width:46px!important;height:46px!important}.auto{min-width:40px;height:19px;font-size:11px}.ults{gap:5px}}
.ult{position:relative;width:66px;height:66px;border-radius:14px;border:3px solid #2a170a;background:#3a2414;overflow:hidden;padding:0;cursor:pointer;box-shadow:0 3px 0 #2a170a}
.ult .pt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ult .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;text-shadow:0 0 4px #000,0 2px 3px #000;pointer-events:none;z-index:2}
.ult .cdt:not(:empty){background:rgba(0,0,0,.35)}
.ult .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(20,10,4,.62);pointer-events:none}
.ult .nm{position:absolute;left:0;right:0;bottom:0;font-size:11px;font-weight:800;text-align:center;background:rgba(0,0,0,.55);line-height:16px;pointer-events:none}
.ultw{display:flex;flex-direction:column;align-items:center;gap:3px}
.auto{font:inherit;font-size:12px;font-weight:900;min-width:52px;height:24px;padding:0 6px;border-radius:12px;border:2px solid #2a170a;background:#5a3a22;color:#e8d8c0;cursor:pointer}
.auto.on{background:linear-gradient(#7fe07a,#33a04a);color:#0f2a10}
.ult.ready{border-color:#ffd86a;animation:pulse 1s infinite alternate}
.ult.ready::after{content:"大招";position:absolute;top:2px;right:2px;font-size:11px;font-weight:900;color:#3a2008;background:#ffd86a;border-radius:6px;padding:0 4px}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,216,106,.9),0 3px 0 #2a170a}to{box-shadow:0 0 14px 4px rgba(255,216,106,.9),0 3px 0 #2a170a}}
.menu{margin-left:auto;display:flex;gap:8px}
.menu .btn{min-width:64px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:15px}
.menu .btn small{font-size:10px;font-weight:700;opacity:.85}
.dot{position:relative}
.dot.on::after{content:"";position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff4a3a;border:2px solid #fff}
.banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-family:var(--title);font-size:clamp(30px,6vw,58px);color:#fff4c8;text-shadow:0 3px 0 #7a3a10,0 0 18px rgba(255,160,40,.8),-2px 0 0 #7a3a10,2px 0 0 #7a3a10;pointer-events:none;white-space:nowrap;opacity:0}
.banner.show{animation:ban 1.6s ease-out forwards}
.banner.boss{color:#ffd0c8;text-shadow:0 3px 0 #6a0a0a,0 0 22px rgba(255,40,40,.9),-2px 0 0 #6a0a0a,2px 0 0 #6a0a0a}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.ultname{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-family:var(--title);font-size:clamp(26px,5vw,46px);font-weight:700;pointer-events:none;opacity:0;white-space:nowrap;color:#fff;text-shadow:0 0 12px var(--c,#ffd86a),0 3px 0 rgba(0,0,0,.6)}
.ultname.show{animation:un 1.1s ease-out forwards}
@keyframes un{0%{opacity:0;letter-spacing:.6em}15%{opacity:1;letter-spacing:.12em}75%{opacity:1}100%{opacity:0}}
.farm{position:absolute;left:calc(max(10px,env(safe-area-inset-left)) + 132px);top:calc(max(8px,env(safe-area-inset-top)) + 8px);white-space:nowrap;z-index:3;font:700 13px/1.2 inherit;font-family:inherit;color:#fff4dc;background:rgba(40,24,12,.78);border:2px solid rgba(255,216,106,.55);border-radius:10px;padding:5px 10px;cursor:pointer}
.farm.on{background:#2a7a3a;border-color:#9be07a}
.buffs{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 56px);z-index:3;display:flex;flex-wrap:wrap;gap:5px;max-width:46vw}
.buffs .bi{position:relative;width:34px;height:34px;border-radius:50%;background:rgba(40,24,12,.85);border:2px solid var(--bc,#ffd86a);color:var(--bc,#ffd86a);font-weight:900;font-size:17px;line-height:30px;text-align:center;cursor:pointer;padding:0}
.buffs .bi i{position:absolute;right:-5px;bottom:-5px;font-style:normal;font-size:10px;line-height:14px;min-width:14px;padding:0 2px;border-radius:7px;background:#2a170a;color:#fff}
.buftip{position:absolute;z-index:6;left:max(10px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 98px);background:rgba(40,24,12,.94);border:2px solid var(--bc,#ffd86a);border-radius:10px;padding:6px 10px;color:#fff;font-size:13px;font-weight:700;max-width:60vw;display:none;pointer-events:none}
.buftip b{color:var(--bc,#ffd86a)}
.buffs span.old{font:700 12px/1.2 inherit;font-family:inherit;color:#fff;background:rgba(40,24,12,.78);border:2px solid var(--bc,#ffd86a);border-radius:10px;padding:2px 7px;white-space:nowrap}
.buffs span b{color:var(--bc,#ffd86a)}.farm.go{background:#b8400e;border-color:#ffb06a;animation:pulse2 1.2s infinite alternate}
.dps{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(max(8px,env(safe-area-inset-top)) + 54px);width:210px;background:rgba(30,18,8,.62);border:1px solid rgba(255,216,106,.35);border-radius:10px;padding:6px 8px 7px;color:#fff4dc;font-size:12px;pointer-events:auto;cursor:pointer;display:block;z-index:3}
.dps.min .r,.dps.min .e{display:none}.dps.min{width:auto}
.dps h4{margin:0 0 4px;font-size:12px;font-weight:700;color:#ffd86a;display:flex;justify-content:space-between}
.dps .r{position:relative;height:17px;line-height:17px;margin-top:2px;border-radius:4px;overflow:hidden;background:rgba(0,0,0,.25)}
.dps .r i{position:absolute;left:0;top:0;bottom:0;opacity:.55}
.dps .r span{position:relative;padding:0 5px;white-space:nowrap;text-shadow:0 1px 0 #000}
.dps .r b{position:absolute;right:5px;top:0;font-weight:700;text-shadow:0 1px 0 #000}
.tipk{cursor:pointer;text-decoration:underline dotted}.tipk i{font-style:normal;font-size:.8em;opacity:.6;margin-left:4px}
.fxs{display:inline-block;padding:0 6px;margin-right:4px;border-radius:6px;font-size:.85em;color:#fff}
.dps .dm{display:flex;gap:3px;margin:0 0 3px}.dps .dm b{flex:1;text-align:center;font-size:11px;padding:2px 0;border-radius:5px;background:rgba(0,0,0,.35);color:#e8d8b8;font-weight:700}.dps .dm b.on{background:#ffd86a;color:#3a2008}
@media (max-height:520px){.dps{width:170px;font-size:10px;padding:4px 6px}.dps .r{height:14px;line-height:14px;margin-top:1px}.dps h4{font-size:11px}}
.bossbar{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 58px);transform:translateX(-50%);width:min(420px,60vw);display:none;pointer-events:none}
.bossbar .lbl{font-family:var(--title);text-align:center;font-size:16px;color:#ffd0c8;text-shadow:0 2px 0 #000}
.bossbar .bar{height:12px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden;border:1px solid rgba(255,180,160,.5)}
.bossbar .bar i{display:block;height:100%;background:linear-gradient(90deg,#c0202a,#ff6a3a);width:100%}
/* panels */
.sheet{position:absolute;inset:0;z-index:7;background:rgba(10,6,3,.55);display:none;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));z-index:5}
.sheet.open{display:flex}
.box{background:var(--panel);color:#3a2414;border:4px solid #5a3a22;border-radius:18px;box-shadow:0 6px 0 #2a170a,0 10px 30px rgba(0,0,0,.5);width:min(860px,100%);height:min(780px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.box header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(#8a5a34,#6a4428);color:var(--ink)}
.box header h2{margin:0;font-family:var(--title);font-size:22px;flex:1}
.box .body{flex:1;min-height:0;padding:12px 14px;overflow:auto;-webkit-overflow-scrolling:touch}
.x{width:44px;height:44px;border-radius:50%;font-size:22px;padding:0;min-height:0}
.tabs{display:flex;gap:6px}
.tabs .btn{padding:4px 12px;min-height:38px;font-size:15px}
.tabs .btn.on{background:linear-gradient(#ffd86a,#e39a1e);color:#3a2008}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.card{position:relative;border-radius:12px;border:3px solid var(--n);background:linear-gradient(#fff,#efe4cf);aspect-ratio:3/4;overflow:hidden;cursor:pointer;padding:0;font:inherit;color:#3a2414}
.card img{position:absolute;left:50%;bottom:22px;height:76%;transform:translateX(-50%);pointer-events:none}
.card .cn{position:absolute;left:0;right:0;bottom:0;font-size:12px;font-weight:800;background:rgba(255,255,255,.85);padding:2px 0;text-align:center}
.card .lv{position:absolute;left:4px;top:3px;font-size:12px;font-weight:900;background:rgba(58,36,20,.85);color:#fff;border-radius:6px;padding:0 5px}
.card .tier{position:absolute;right:4px;top:3px;font-size:11px;color:#ff9a1e;text-shadow:0 1px 0 #fff}
.card.R{border-color:var(--r)}.card.E{border-color:var(--e);background:linear-gradient(#fbf4ff,#e8d4ff)}.card.L{border-color:var(--l);background:linear-gradient(#fff8dc,#ffe2a0)}.card.S{border-color:var(--s)}

html.uiimg .ico{border-radius:0;transform:none;box-shadow:none;width:22px;height:22px;background-position:center;background-size:contain;background-repeat:no-repeat}
html.uiimg .ico.coin{background-image:var(--i-coin)}html.uiimg .ico.gem{background-image:var(--i-gem)}html.uiimg .ico.stone{background-image:var(--i-stone)}html.uiimg .ico.pill{background-image:var(--i-pill)}
html.uiimg .card{border-color:transparent;border-radius:6px}
html.uiimg .card::after{content:"";position:absolute;inset:0;background:var(--f-N) center/100% 100% no-repeat;pointer-events:none;z-index:2}
html.uiimg .card.R::after{background-image:var(--f-R)}html.uiimg .card.E::after{background-image:var(--f-E)}html.uiimg .card.L::after{background-image:var(--f-L)}
.card>span{z-index:3}.card .cn{left:8%;right:8%;bottom:6%}.card img{bottom:15%;height:70%}
.card.inteam::before{z-index:3;bottom:16%;left:9%}.card .up{bottom:16%;right:9%}.card .lv{left:9%;top:6%}.card .tier{right:9%;top:6%}
.pulls .card::before{content:"";position:absolute;inset:0;z-index:5;background:var(--f-back,#2a6a50) center/100% 100% no-repeat;animation:unflip .5s forwards;animation-delay:calc(var(--d,0s) + .25s)}
@keyframes unflip{0%{opacity:1;transform:none}100%{opacity:0;transform:rotateY(90deg)}}
.pulls .card{animation-delay:var(--d,0s)}
.gacha.altar{height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(rgba(255,250,240,.15),rgba(255,250,240,.55)),var(--altar) center/cover no-repeat;border-radius:14px;padding:16px 8px 12px}
.gacha.altar .rates{background:rgba(255,250,240,.88);border-radius:10px;padding:6px 10px}
.ultw{position:relative}
.ult{border-radius:50%;border:none;box-shadow:0 3px 6px rgba(0,0,0,.5)}
.ult .fill{border-radius:0}
.ult.beast{background:#1c3a4a}
.ultw .ring{position:absolute;left:-9px;top:-14px;width:84px;height:89px;background:var(--ultring) center/contain no-repeat;pointer-events:none}
@media (max-height:430px){.ultw .ring{left:-7px;top:-11px;width:68px;height:72px}}
.ult.ready{animation:pulse2 1s infinite alternate}
.ult.ready::after{top:auto;bottom:4px;right:50%;transform:translateX(50%)}
@keyframes pulse2{from{box-shadow:0 0 0 0 rgba(255,216,106,.9)}to{box-shadow:0 0 16px 6px rgba(255,216,106,.95)}}
.item.on{border-color:#e39a1e;box-shadow:0 0 0 2px #ffd86a inset}
.sec{margin:14px 0 8px;font-family:var(--title)}
.hint{font-size:13px;color:#7a5a3a}

.card.locked{filter:grayscale(1) brightness(.55);cursor:default}
.card.inteam::before{content:"上陣";position:absolute;left:4px;bottom:24px;z-index:1;font-size:11px;font-weight:900;background:#33a04a;color:#fff;border-radius:6px;padding:0 5px}
.card .up{position:absolute;right:4px;bottom:24px;z-index:1;font-size:11px;font-weight:900;background:#ff4a3a;color:#fff;border-radius:6px;padding:0 5px}
.hlay{display:flex;gap:14px;align-items:stretch}.hleft{flex:0 0 38%;max-height:calc(100dvh - 150px);overflow-y:auto;padding-right:4px}.hright{flex:1;min-width:0;max-height:calc(100dvh - 150px);overflow-y:auto}.hlay .detail .pic{flex-basis:150px;height:170px}.hlay .grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}@media (max-width:760px){.hlay{flex-direction:column}.hleft{flex:none;max-height:34dvh}.hright{max-height:none}}
.detail{display:flex;gap:14px;flex-wrap:wrap}
.detail .pic{flex:0 0 220px;height:240px;border-radius:14px;background:radial-gradient(circle at 50% 70%,#fff,#e9dcc0);position:relative;border:3px solid var(--n)}
.detail .pic{overflow:hidden}.detail .pic img{position:absolute;left:50%;bottom:10px;height:90%;max-width:100%;object-fit:contain;object-position:50% 100%;transform:translateX(-50%)}
.detail .info{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.detail h3{margin:0;font-family:var(--title);font-size:26px}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:8px;padding:1px 8px;color:#fff;background:var(--n);margin-right:4px}
.tag.R{background:var(--r)}.tag.E{background:var(--e)}.tag.L{background:var(--l)}.tag.S{background:#33a04a}.tag.M{background:linear-gradient(90deg,#ff3a6a,#ffb02a,#7a5cff)}
.stat{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15px}
.stat b{color:#7a4a20}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cost{display:inline-flex;align-items:center;gap:4px;font-weight:900}
.tiers{display:flex;gap:6px;margin-top:4px}
.tiers span{width:44px;height:56px;border-radius:8px;border:2px solid #cbb998;position:relative;overflow:hidden;background:#fff}
.tiers span img{position:absolute;left:50%;bottom:2px;height:92%;transform:translateX(-50%)}
.tiers span.no img{filter:brightness(0) opacity(.25)}
.tiers span.cur{border-color:#e39a1e;box-shadow:0 0 0 2px #ffd86a}
.gacha{display:flex;flex-direction:column;align-items:center;gap:12px}
.gacha .rates{font-size:13px;color:#7a5a3a;text-align:center}
.pulls{display:grid;grid-template-columns:repeat(5,minmax(0,110px));gap:8px;justify-content:center;min-height:min(310px,calc((100vw - 60px)/5*4/3*2 + 8px))}

.pulls .card .new{position:absolute;left:4px;top:3px;font-size:11px;font-weight:900;background:#ff4a3a;color:#fff;border-radius:6px;padding:0 5px}

.pulls .card.E{box-shadow:0 0 12px 3px rgba(176,108,255,.8)}.pulls .card.L{box-shadow:0 0 16px 4px rgba(255,176,46,.9)}
.list{display:flex;flex-direction:column;gap:8px}

 Q('[data-tt]',b=>{const k=b.dataset.tt;if(S.turTeam.includes(k))S.turTeam=S.turTeam.filter(x=>x!==k);else{if(S.turTeam.length>=turSlots()){toast(`塔位只有 ${turSlots()} 座，升級山門可以多擺`);return}S.turTeam.push(k)}refreshField();renderGate()});
 const upArr=(k,n)=>{let c=0;while(c<n){const cc=turCost(S.arr[k].lv);if(S.coin<cc)break;S.coin-=cc;S.arr[k].lv++;c++}if(!c)return;if(S.arrD===k)refreshField();if(n>1)toast(`${ARR[k].n} 升了 ${c} 級`);persist();renderGate();updLive()};
 Q('[data-au]',b=>upArr(b.dataset.au,1));Q('[data-au99]',b=>upArr(b.dataset.au99,99));
 Q('[data-as]',b=>{const k=b.dataset.as,sl=b.dataset.sl;S[sl]=S[sl]===k?null:k;refreshField();renderGate()});
 const upBeast=(k,n)=>{const f0=bFxN(k);let c=0;while(c<n){const cc=Math.ceil(turCost(S.beast[k].lv)*1.4);if(S.coin<cc)break;S.coin-=cc;S.beast[k].lv++;c++}if(!c)return;if(bFxN(k)>f0)toast(`${BEAST[k].n} 學會新效果：${BFX[k][bFxN(k)-1].t}`);else if(n>1)toast(`${BEAST[k].n} 升了 ${c} 級`);calcPassives();persist();renderGate();updLive()};
 Q('[data-bs]',b=>{const k=b.dataset.bs,has=S.beast[k],fr=S.bfr[k]||0;if(!has){if(fr<B_STAR[1])return;S.bfr[k]=fr-B_STAR[1];S.beast[k]={st:1};if(S.beastTeam.length<beastSlots())S.beastTeam.push(k);SND.play('rare');toast(`神獸 ${BEAST[k].n} 合成成功！`)}else{const st=bSt(k);if(st<B_MAX){if(fr<B_STAR[st+1])return;S.bfr[k]=fr-B_STAR[st+1];has.st=st+1;SND.play('rare');toast(`${BEAST[k].n} 升到 ${has.st} 星！${B_FXAT.includes(has.st)?`學會新效果：${BFX[k][B_FXAT.indexOf(has.st)].t}`:has.st<=5?`光環提升`:has.st<=15?`${BFX[k][(has.st-6)%4].t} 升到 Lv${bFxLv(k,(has.st-6)%4)}`:`大招升到 Lv${bUlv(k)}`}`)}else{if(fr<B_BRK||(has.brk||0)>=B_BRKMAX)return;S.bfr[k]=fr-B_BRK;has.brk=(has.brk||0)+1;toast(`${BEAST[k].n} 突破 +${has.brk}`)}}refreshField();renderGate();updLive()});
 Q('[data-tr]',b=>{trialStart(+b.dataset.tr)});
 Q('[data-bt]',b=>{const k=b.dataset.bt;if(S.beastTeam.includes(k))S.beastTeam=S.beastTeam.filter(x=>x!==k);else{if(S.beastTeam.length>=beastSlots()){toast(`現在只能帶 ${beastSlots()} 隻神獸，升級山門可以多帶`);return}S.beastTeam.push(k)}refreshField();renderGate()});
}
/* 獎勵 */
let giftOpen=false;
function giveGift(g){let title,img,text;
 if(g.type==='tur'){S.tur[g.k]={lv:1};if(S.turTeam.length<turSlots())S.turTeam.push(g.k);title='獲得新的塔！';img=SRC['t_'+g.k+'_1'];text=`${TUR[g.k].n}：${TUR[g.k].d}。擺在山門前面自動攻擊。`}
 else if(g.type==='arr'){S.arr[g.k]=S.arr[g.k]||{lv:1};if(ARR[g.k].t==='a'&&!S.arrA)S.arrA=g.k;title='獲得陣法！';img=SRC['i_'+g.k];text=`${ARR[g.k].n}：${ARR[g.k].d}。`}
 else{S.beast[g.k]={lv:1};if(S.beastTeam.length<beastSlots()&&!S.beastTeam.includes(g.k))S.beastTeam.push(g.k);title='神獸來了！';img=SRC['b_'+g.k];text=`神獸 ${BEAST[g.k].n} 願意守護山門！${BEAST[g.k].d}。`}
 giftOpen=true;SND.play('rare');$('gfTitle').textContent=title;$('gfImg').src=img;$('gfText').textContent=text;$('gift').classList.add('open');refreshField()}
$('gfOk').onclick=()=>{$('gift').classList.remove('open');giftOpen=false};
/* 離線收穫 */
function ascend(){const g=xyGain(S.best||0);if(!g)return;const b0=S.best||0;S.xy=(S.xy||0)+g;S.asc=(S.asc||0)+1;
 S.stage=1;S.best=0;S.farm=0;S.farmN=0;S.gateLv=1;S.coin=0;S.stone=0;S.train={atk:0,hp:0,coin:0,ult:0};
 // 快速起跑：前一半的關卡直接算過關，拿到那些關卡打怪和過關的銅錢、山門石
 const sk=Math.floor(b0/2);let fc=0,fs=0;for(let st=1;st<=sk;st++){const bs=st%10===0,tens=Math.floor(st/10);fc+=(5*Math.pow(1.088,st-1)*(bs?4:1)+30*coinKill(st,1))*XYR();fs+=(bs?20+5*tens:4+2*tens)*XYR()}
 S.coin=Math.round(fc);S.stone=Math.round(fs);S.best=sk;S.stage=sk+1;
 for(const id in S.roster)S.roster[id].lv=1;for(const k in S.tur)S.tur[k].lv=1;for(const k in S.arr)S.arr[k].lv=1;
 persist();closePanel();if(typeof updFarm==='function')updFarm();refreshField();startStage();
 giftOpen=true;$('gfTitle').textContent=`飛升成功！（第 ${S.asc} 次）`;$('gfImg').src=charImg(S.team[0]);$('gfText').textContent=`拿到 ${g} 仙元，現在共 ${S.xy}（攻擊 ×${XYA0().toFixed(2)}）、銅錢和山門石 ×${XYR().toFixed(2)}，境界升到「${realmName(S.asc)}」：攻擊再 ×${RLM_MUL}、等級上限 +${RLM_LV}。前 ${S.best} 關直接算過關，拿到 ${fmt(S.coin)} 銅錢、${fmt(S.stone)} 山門石，從第 ${S.stage} 關出發！`;$('gift').classList.add('open');SND.play('rare');updHud()}
// 離線收益：照最近實際刷關速度（最近一小時內、中間沒有斷超過 10 分鐘的過關紀錄）給 50%，最多算 12 小时；沒紀錄就用舊的保底
function farmRate(){const w=S.wlog||[];let i=w.length-1;while(i>0&&w[i][0]-w[i-1][0]<600e3)i--;const seg=w.slice(i);if(seg.length<3)return null;const span=(seg[seg.length-1][0]-seg[0][0])/1000;if(span<60)return null;let c=0,g=0,st=0;for(let k=1;k<seg.length;k++){c+=seg[k][1];g+=seg[k][2];st+=seg[k][3]}return{c:c/span,g:g/span,s:st/span,wph:(seg.length-1)/span*3600}}
function offline(){const dt=(Date.now()-(S.seen||Date.now()))/1000;if(dt<120)return;const t=Math.min(dt,12*3600);const s=Math.max(1,S.best);
 const perMin=coinKill(s,1.1)*(5+s*.6)/1.2;const fr=farmRate(),H=.5;let c=Math.round(perMin*t/60*.5*TR('coin')*XYR()),gm=Math.min(120,Math.floor(t/3600*10)),stn=0;
 if(fr){c=Math.max(c,Math.round(fr.c*t*H));gm=Math.max(gm,Math.round(fr.g*t*H));stn=Math.round(fr.s*t*H)}if(c<1)return;S.coin+=c;S.gem+=gm;S.stone+=stn;S.seen=Date.now();S.wlog=[];
 giftOpen=true;$('gfTitle').textContent='閉關回來了';$('gfImg').src=charImg(S.team[0]);$('gfText').textContent=`你不在的 ${t>=3600?Math.floor(t/3600)+' 小時 ':''}${Math.floor(t%3600/60)} 分鐘，弟子們守住山門，賺到 ${fmt(c)} 銅錢${gm?`、${gm} 靈石`:''}${stn?`、${fmt(stn)} 山門石`:''}！${fr?`（照你最近每小時過 ${Math.round(fr.wph)} 關的速度，算一半）`:'（還沒有刷關紀錄，先給保底）'}`;$('gift').classList.add('open');persist()}
/* 啟動 */
loadAll().then(()=>{
 try{for(const k of BGS){if(!IMG[k])continue;const c=document.createElement('canvas');c.width=4;c.height=4;const g=c.getContext('2d');g.drawImage(IMG[k],0,0,1536,3,0,0,1,1);const d=g.getImageData(0,0,1,1).data;SKYS[k]=`rgb(${d[0]},${d[1]},${d[2]})`}SKY=SKYS.bg_meadow||SKY}catch(e){}
 try{const R=document.documentElement.style,u=k=>`url(${SRC[k]})`;[['--i-coin','u_res_coin'],['--i-gem','u_res_spirit'],['--i-stone','u_res_gatestone'],['--i-pill','u_res_pill'],['--f-N','u_card_common'],['--f-R','u_card_rare'],['--f-E','u_card_epic'],['--f-L','u_card_legend'],['--f-back','u_card_back'],['--altar','u_gacha_altar'],['--ultring','u_ui_ult_frame']].forEach(([a,b])=>{if(SRC[b])R.setProperty(a,u(b))});document.documentElement.classList.add('uiimg')}catch(e){}
 $('loading').style.display='none';resize();buildField();startStage();
 {const got=[];for(const st in GIFTS){if(S.best>=+st){const g=GIFTS[st];const box=g.type==='tur'?S.tur:g.type==='arr'?S.arr:S.beast;if(!box[g.k]){box[g.k]={lv:1};
   if(g.type==='tur'&&S.turTeam.length<turSlots())S.turTeam.push(g.k);if(g.type==='arr'&&ARR[g.k].t==='a'&&!S.arrA)S.arrA=g.k;if(g.type==='beast'&&S.beastTeam.length<beastSlots())S.beastTeam.push(g.k);
   got.push(g.type==='tur'?TUR[g.k].n:g.type==='arr'?ARR[g.k].n:'神獸'+BEAST[g.k].n)}}}
  if(!S.fbGiven){S.fbGiven=1;const n=Math.floor(S.best/10*.35)+Math.floor(S.best/100)*2;for(let i=0;i<n;i++){const r=giveFb();got.push('法寶'+FB[r.k].n)}}
  if(got.length){refreshField();giftOpen=true;$('gfTitle').textContent='補發過關獎勵';$('gfImg').src=SRC['b_'+(S.beastTeam[0]||'baihu')];$('gfText').textContent=`你之前已經過的關卡，獎勵補給你：${got.join('、')}。到「山門」裡可以設定上陣。`;$('gift').classList.add('open')}}
 if(!giftOpen)offline();requestAnimationFrame(t=>{last=t;frame(t)});
 window.__B=B;window.__pick=()=>pick;window.__S=S;window.__fast=sec=>{for(let t=0;t<sec;t+=.05){step(.05);if(giftOpen){$('gift').classList.remove('open');giftOpen=false}}};window.__api={startStage,levelUp,pull,gpOne,trainCost,beastSlots,setG:t=>{gTab=t},heroAtk,lvCost,lvCap,gateCost,turCost,refreshField};
});
