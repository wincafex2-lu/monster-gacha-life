<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>南天門美術圖庫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：上方總進度＋篩選，下面依類別排格子；每格是一個「應該要有的檔名」，有圖就顯示，沒圖就是空格 */
:root {
  --paper: #f2ecdf; --card: #fbf8f1; --ink: #23201c; --muted: #6e665b; --line: #d9cfbd;
  --seal: #b33a2c; --jade: #2f7a5c; --check1: #e9e2d3; --check2: #f7f3ea;
  --serif: "Noto Serif TC", "Songti TC", serif; --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #1c1a17; --card: #26231f; --ink: #eee6d8; --muted: #a59b8b; --line: #3b362f; --seal: #e0705f; --jade: #6cc39a; --check1: #2e2a25; --check2: #36312b; color-scheme: dark } }
:root[data-theme="dark"] { --paper: #1c1a17; --card: #26231f; --ink: #eee6d8; --muted: #a59b8b; --line: #3b362f; --seal: #e0705f; --jade: #6cc39a; --check1: #2e2a25; --check2: #36312b; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; }
header { display: grid; gap: 8px; }
h1 { font: 900 2rem/1.2 var(--serif); margin: 0; letter-spacing: 0.04em; text-wrap: balance; }
h1 .seal { display: inline-block; font-size: 0.9rem; color: var(--paper); background: var(--seal); padding: 2px 6px; border-radius: 3px; vertical-align: middle; margin-left: 8px; letter-spacing: 0.1em; }
.lead { margin: 0; color: var(--muted); max-width: 66ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 0.9rem; background: var(--card); color: var(--ink); border: 0; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn { font: inherit; font-size: 0.9rem; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.lab { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.1em; }
.status { font-size: 0.88rem; color: var(--muted); }
.status.err { color: var(--seal); }
.sum { display: flex; flex-wrap: wrap; gap: 8px; }
.sum a { text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
.sum a b { color: var(--jade); }
section.cat { display: grid; gap: 12px; }
section.cat h2 { font: 700 1.3rem/1.3 var(--serif); margin: 0; display: flex; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
section.cat h2 small { font: 500 0.85rem var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.slot { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.slot.miss { background: transparent; border-style: dashed; }
.pic { aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; border-radius: 4px; overflow: hidden; }
.wide .pic { aspect-ratio: 32 / 9; }
.bg-check .pic { background: repeating-conic-gradient(var(--check1) 0 25%, var(--check2) 0 50%) 0 0 / 16px 16px; }
.bg-paper .pic { background: #efe5cf; }
.bg-dark .pic { background: #2a2622; }
.pic img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.miss .pic { background: none; color: var(--muted); font-size: 0.85rem; }
.name { font-weight: 700; font-size: 0.95rem; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.name .act { font-weight: 500; color: var(--muted); font-size: 0.82rem; }
.file { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.75rem; color: var(--muted); overflow-wrap: anywhere; }
.vers { display: flex; flex-wrap: wrap; gap: 4px; }
.vers button { font: inherit; font-size: 0.72rem; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: 0 8px; cursor: pointer; }
.vers button[aria-pressed="true"] { border-color: var(--jade); color: var(--jade); }
.meta { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta a { color: var(--muted); }
.hide-miss .slot.miss, .hide-have .slot:not(.miss) { display: none; }
.empty-note { color: var(--muted); font-size: 0.9rem; margin: 0; }
</style>
</head>
<body class="bg-check">
<div class="wrap">
  <header>
    <h1>南天門美術圖庫<span class="seal">即時</span></h1>
    <p class="lead">GPT 上傳到 GitHub 的圖都會出現在這裡，包含所有 <code>art/nantianmen-*</code> 分支和 main。每一格是規格裡應該要有的一張圖，虛線框代表還沒畫。同一張圖在好幾個分支都有時，可以點下面的分支名稱切換。</p>
  </header>

  <div class="bar">
    <span class="lab">顯示</span>
    <div class="seg" id="f-show"><button id="s-all" data-v="all" aria-pressed="true">全部</button><button id="s-have" data-v="have" aria-pressed="false">已到</button><button id="s-miss" data-v="miss" aria-pressed="false">還沒畫</button></div>
    <span class="lab">底色</span>
    <div class="seg" id="f-bg"><button id="b-check" data-v="check" aria-pressed="true">透明格子</button><button id="b-paper" data-v="paper" aria-pressed="false">宣紙</button><button id="b-dark" data-v="dark" aria-pressed="false">深色</button></div>
    <button class="btn" id="reload" type="button">重新讀取</button>
    <span class="status" id="status">讀取中…</span>
  </div>

  <div class="sum" id="sum"></div>
  <div id="cats"></div>
</div>

<script>
(function () {
  var OWNER = 'wincafex2-lu', REPO = 'monster-gacha-life', DIR = 'nantianmen-art/images';
  var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO;
  var IA = ['idle', 'attack'], IDLE = ['idle'];
  var ACT = { idle: '站立', attack: '攻擊', field: '普通版', xian: '仙器版', sky: '天空', far: '遠景', mid: '中景', ground: '地面' };
  var CATS = [
    { id: 'hero', name: '主角', items: [['hero-chores', '雜役服', IA], ['hero-sword', '劍修', IA], ['hero-alchemy', '丹修', IA], ['hero-tamer', '御獸師', IA], ['hero-shop', '小掌櫃', IA], ['hero-talisman', '符修', IA]] },
    { id: 'beast', name: '神獸', items: [['feng', '阿鳳', IA], ['baihu', '白虎', IA], ['xuanwu', '玄武', IA], ['baize', '白澤', IA], ['qinglong', '青龍', IA], ['qilin', '麒麟', IA], ['jiuwei', '九尾狐', IA], ['taotie', '饕餮', IA], ['fenghuang', '鳳凰', IA]] },
    { id: 'boss', name: '魔王與人物大將', items: [['heixiong', '黑熊精', IA], ['shuyao', '千年樹妖', IA], ['kuilei', '傀儡將軍', IA], ['niutou', '牛頭魔', IA], ['tietou', '鐵頭師兄', IA], ['shen', '沈傲天', IA], ['ye', '夜無塵', IA]] },
    { id: 'mob', name: '小怪', items: [['mogu', '蘑菇妖', IDLE], ['limao', '狸貓妖', IDLE], ['shijing', '石頭精', IDLE], ['jiangshi', '小殭屍', IDLE], ['denglong', '燈籠妖', IDLE], ['shuzhuang', '樹樁妖', IDLE], ['houyao', '猴妖', IDLE], ['sheyao', '蛇妖', IDLE], ['bianfu', '蝙蝠妖', IDLE], ['kulou', '骷髏兵', IDLE], ['langyao', '狼妖', IDLE], ['zhiren', '紙人', IDLE]] },
    { id: 'treasure', name: '法器', items: [['feijian', '飛劍'], ['hulu', '紫金葫蘆'], ['leizhu', '雷晶珠'], ['bagua', '八卦鏡'], ['fuzhen', '符紙陣'], ['tieguo', '大鐵鍋'], ['ruyi', '玉如意']].map(function (x) { return [x[0], x[1], ['field', 'xian']]; }) },
    { id: 'bg', name: '背景', wide: true, items: [['bg-bamboo', '雜役峰後山'], ['bg-herb', '萬藥谷'], ['bg-town', '柳溪鎮'], ['bg-volcano', '赤焰火山'], ['bg-cloud', '雲海仙境'], ['bg-palace', '南天門']].map(function (x) { return [x[0], x[1], ['sky', 'far', 'mid', 'ground']]; }) }
  ];

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function getJSON(url) {
    return fetch(url, { headers: { Accept: 'application/vnd.github+json' } }).then(function (r) {
      if (r.status === 404) return null;
      if (r.status === 403 || r.status === 429) throw new Error('rate');
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  }
  function kb(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB'; }

  // files: { 'baihu__idle.png': [{branch, url, size, html}] }
  function load() {
    $('status').className = 'status'; $('status').textContent = '讀取中…';
    getJSON(API + '/branches?per_page=100').then(function (bs) {
      var names = (bs || []).map(function (b) { return b.name; }).filter(function (n) { return n === 'main' || n.indexOf('art/nantianmen') === 0; });
      names.sort(function (a, b) { return a === 'main' ? 1 : b === 'main' ? -1 : a < b ? 1 : -1; });
      return Promise.all(names.map(function (n) {
        return getJSON(API + '/contents/' + DIR + '?ref=' + encodeURIComponent(n)).then(function (list) { return { branch: n, list: Array.isArray(list) ? list : [] }; });
      }));
    }).then(function (res) {
      var files = {};
      res.forEach(function (r) {
        r.list.forEach(function (f) {
          if (f.type !== 'file' || !/\.(png|jpe?g|webp)$/i.test(f.name)) return;
          (files[f.name] = files[f.name] || []).push({ branch: r.branch, url: f.download_url, size: f.size, html: f.html_url, sha: f.sha });
        });
      });
      render(files);
      var when = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
      $('status').textContent = '讀了 ' + res.length + ' 個分支，' + when + ' 更新';
    }).catch(function (e) {
      $('status').className = 'status err';
      $('status').textContent = e.message === 'rate' ? 'GitHub 暫時限制讀取次數（每小時 60 次），請過幾分鐘再按「重新讀取」。' : '讀不到 GitHub，請檢查網路後按「重新讀取」。';
    });
  }

  function slotHTML(file, label, act, vers) {
    if (!vers) return '<div class="slot miss"><div class="pic">還沒畫</div><div class="name">' + esc(label) + '<span class="act">' + esc(ACT[act] || act) + '</span></div><div class="file">' + esc(file) + '</div></div>';
    // 不同分支內容一樣的只算一個版本
    var seen = {}, uniq = vers.filter(function (v) { if (seen[v.sha]) return false; seen[v.sha] = 1; return true; });
    var v = uniq[0];
    var chips = uniq.length > 1 ? '<div class="vers">' + uniq.map(function (u, i) { return '<button type="button" data-src="' + esc(u.url) + '" data-meta="' + esc(u.branch + '|' + kb(u.size) + '|' + u.html) + '" aria-pressed="' + (i ? 'false' : 'true') + '">' + esc(u.branch.replace('art/nantianmen-', '')) + '</button>'; }).join('') + '</div>' : '';
    return '<div class="slot"><a class="pic" href="' + esc(v.url) + '" target="_blank" rel="noopener"><img loading="lazy" src="' + esc(v.url) + '" alt="' + esc(label + ' ' + (ACT[act] || act)) + '"></a>' +
      '<div class="name">' + esc(label) + '<span class="act">' + esc(ACT[act] || act) + '</span></div><div class="file">' + esc(file) + '</div>' + chips +
      '<div class="meta">' + metaHTML(v.branch, kb(v.size), v.html) + '</div></div>';
  }
  function metaHTML(branch, size, html) { return esc(branch) + ' · ' + esc(size) + ' · <a href="' + esc(html) + '" target="_blank" rel="noopener">GitHub</a>'; }

  function render(files) {
    var used = {}, out = '', sum = '', total = 0, have = 0;
    CATS.forEach(function (c) {
      var cells = '', n = 0, h = 0;
      c.items.forEach(function (it) {
        it[2].forEach(function (act) {
          var f = it[0] + '__' + act + '.png'; used[f] = 1; n++;
          if (files[f]) h++;
          cells += slotHTML(f, it[1], act, files[f]);
        });
      });
      total += n; have += h;
      out += '<section class="cat" id="cat-' + c.id + '"><h2>' + esc(c.name) + '<small>' + h + ' / ' + n + '</small></h2><div class="grid' + (c.wide ? ' wide' : '') + '">' + cells + '</div></section>';
      sum += '<a href="#cat-' + c.id + '">' + esc(c.name) + ' <b>' + h + '</b>/' + n + '</a>';
    });
    var extra = Object.keys(files).filter(function (f) { return !used[f]; }).sort();
    if (extra.length) {
      out += '<section class="cat" id="cat-other"><h2>其他檔名<small>' + extra.length + ' 張，檔名不在規格裡，請確認是哪一張</small></h2><div class="grid">' +
        extra.map(function (f) { return slotHTML(f, f.replace(/\.\w+$/, ''), '', files[f]); }).join('') + '</div></section>';
      sum += '<a href="#cat-other">其他 <b>' + extra.length + '</b></a>';
    }
    $('cats').innerHTML = out;
    $('sum').innerHTML = '<a href="#cats">全部 <b>' + have + '</b>/' + total + '</a>' + sum;
  }

  // 切換同一張圖的分支版本
  $('cats').addEventListener('click', function (e) {
    var b = e.target.closest('.vers button'); if (!b) return;
    var slot = b.closest('.slot'), m = b.dataset.meta.split('|');
    slot.querySelector('img').src = b.dataset.src; slot.querySelector('.pic').href = b.dataset.src;
    slot.querySelector('.meta').innerHTML = metaHTML(m[0], m[1], m[2]);
    slot.querySelectorAll('.vers button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
  });
  function seg(id, fn) {
    $(id).addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      $(id).querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      fn(b.dataset.v);
    });
  }
  seg('f-show', function (v) { document.body.classList.toggle('hide-miss', v === 'have'); document.body.classList.toggle('hide-have', v === 'miss'); });
  seg('f-bg', function (v) { document.body.classList.remove('bg-check', 'bg-paper', 'bg-dark'); document.body.classList.add('bg-' + v); });
  $('reload').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
